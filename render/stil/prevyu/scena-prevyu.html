<body><div id="ui"></div>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {BokehPass} from 'three/addons/postprocessing/BokehPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

await document.fonts.load('900 40px M','ЭКИПАЖ 1?');await document.fonts.load('800 40px M','А1');
const FRAME = new URLSearchParams(location.search).get('f') || '1';
const W=1080,H=1920;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H); renderer.setPixelRatio(1);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.1;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(40,W/H,0.1,2000);
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),0.04).texture;scene.environmentIntensity=0.12;

// ---------- deterministic random
let seed=7; const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
function noise3(x,y,z){const s=Math.sin(x*1.7+y*3.1+z*2.3)*0.5+Math.sin(x*4.3-z*2.9+y*1.1)*0.3+Math.sin(y*5.7+z*4.1-x*3.3)*0.2;return s;}

// ---------- background: nebula + stars
function nebulaTexture(){
  const c=document.createElement('canvas');c.width=1024;c.height=2048;const g=c.getContext('2d');
  const bg=g.createLinearGradient(0,0,0,2048);bg.addColorStop(0,'#070a1f');bg.addColorStop(.5,'#0d0b2a');bg.addColorStop(1,'#04050f');
  g.fillStyle=bg;g.fillRect(0,0,1024,2048);
  const blobs=[[300,500,520,'rgba(120,60,200,0.35)'],[760,900,600,'rgba(30,140,200,0.28)'],[420,1350,520,'rgba(230,80,140,0.22)'],[800,300,380,'rgba(60,200,220,0.18)'],[200,1700,500,'rgba(90,50,180,0.3)']];
  g.globalCompositeOperation='lighter';
  for(const [x,y,r,col] of blobs){const rg=g.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,col);rg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=rg;g.fillRect(0,0,1024,2048);}
  for(let i=0;i<2500;i++){const a=rnd();g.fillStyle=`rgba(255,255,255,${a*0.8})`;const s=a>0.97?2.2:1;g.fillRect(rnd()*1024,rnd()*2048,s,s);}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
scene.background=nebulaTexture();
{ const n=1500,pos=new Float32Array(n*3);for(let i=0;i<n;i++){const v=new THREE.Vector3(rnd()-.5,rnd()-.5,rnd()-.5).normalize().multiplyScalar(300+rnd()*400);pos.set([v.x,v.y,v.z],i*3);}
  const gm=new THREE.BufferGeometry();gm.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(gm,new THREE.PointsMaterial({color:0xffffff,size:1.6,sizeAttenuation:false,transparent:true,opacity:.9})));}

// ---------- lights
scene.add(new THREE.AmbientLight(0x5566aa,0.2));
const hemi=new THREE.HemisphereLight(0x8fb8ff,0x2a1030,0.35);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffe2b8,3.2);sun.position.set(-8,6,-6);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-6,right:6,top:6,bottom:-6,near:1,far:40});scene.add(sun);
const fill=new THREE.DirectionalLight(0x6ff3ff,0.6);fill.position.set(6,2,8);scene.add(fill);

// ---------- voxel asteroid
const box=new THREE.BoxGeometry(1,1,1);
function asteroid(R=2.2,vox=0.22,{lava=true,flatTop=true}={}){
  const g=new THREE.Group();
  const rocks=[],lavas=[];const n=Math.ceil(R/vox)+1;
  for(let i=-n;i<=n;i++)for(let j=-n;j<=n;j++)for(let k=-n;k<=n;k++){
    const p=new THREE.Vector3(i,j,k).multiplyScalar(vox);
    let rr=R*(1+0.18*noise3(p.x*0.9,p.y*0.9,p.z*0.9));
    if(flatTop&&p.y>R*0.35) continue;           // ровная площадка сверху под постройки
    const d=p.length(); if(d>rr) continue;
    const topLayer=flatTop&&p.y>R*0.35-vox*1.01;
    if(d<rr-vox*1.8&&!topLayer) continue;       // оболочка + сплошная верхняя площадка
    const crack=lava&&Math.abs(noise3(p.x*2.2+3,p.y*2.2,p.z*2.2-1))<0.022&&p.y<R*0.25;
    (crack?lavas:rocks).push(p);
  }
  const rockMat=new THREE.MeshStandardMaterial({roughness:.92,metalness:.05,vertexColors:false,color:0xffffff});
  const im=new THREE.InstancedMesh(box,rockMat,rocks.length);im.castShadow=im.receiveShadow=true;
  const m=new THREE.Matrix4(),c=new THREE.Color();
  rocks.forEach((p,i)=>{m.makeScale(vox,vox,vox).setPosition(p);im.setMatrixAt(i,m);
    const t=0.5+0.5*noise3(p.x*3,p.y*3,p.z*3);const top=p.y>R*0.3;
    c.setHSL(top?0.07:0.04+0.03*t,top?0.16:0.18,top?0.22+0.08*t:0.09+0.08*t);im.setColorAt(i,c);});
  g.add(im);
  if(lavas.length){const lm=new THREE.MeshStandardMaterial({color:0xff7a1a,emissive:0xff5a00,emissiveIntensity:2.2,roughness:.5});
    const il=new THREE.InstancedMesh(box,lm,lavas.length);lavas.forEach((p,i)=>{m.makeScale(vox*1.02,vox*1.02,vox*1.02).setPosition(p);il.setMatrixAt(i,m);});g.add(il);
    const pl=new THREE.PointLight(0xff6a10,1.5,5,2);pl.position.set(0,-R*0.4,R*0.6);g.add(pl);}
  return g;
}

// ---------- brass sign
function sign(){
  const c=document.createElement('canvas');c.width=1024;c.height=640;const x=c.getContext('2d');
  const gr=x.createLinearGradient(0,0,0,640);gr.addColorStop(0,'#e6b85c');gr.addColorStop(.5,'#b9842c');gr.addColorStop(1,'#8a5a1c');
  x.fillStyle=gr;x.fillRect(0,0,1024,640);x.strokeStyle='#5a3810';x.lineWidth=24;x.strokeRect(12,12,1000,616);
  x.fillStyle='#2a1a06';x.font='900 230px M';x.textAlign='center';x.textBaseline='middle';
  x.shadowColor='#6ff3ff';x.shadowBlur=40;x.fillStyle='#bff9ff';x.fillText('???',512,200);
  x.shadowBlur=0;x.fillStyle='#14203f';x.fillRect(70,370,884,200);x.strokeStyle='#e8f4ff';x.lineWidth=10;x.strokeRect(80,380,864,180);
  x.fillStyle='#ffffff';x.font='900 112px M';x.fillText('ЭКИПАЖ: ',450,472);x.fillStyle='#45f08a';x.shadowColor='#45f08a';x.shadowBlur=30;x.fillText('1',790,472);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;
  const g=new THREE.Group();
  const face=new THREE.Mesh(new THREE.BoxGeometry(1.6,1.0,0.08),[0,0,0,0].map(()=>new THREE.MeshStandardMaterial({color:0x7a4d18,metalness:.8,roughness:.35})).concat([new THREE.MeshStandardMaterial({map:t,metalness:.35,roughness:.4,emissiveMap:t,emissive:0xffffff,emissiveIntensity:.35}),new THREE.MeshStandardMaterial({color:0x7a4d18,metalness:.8,roughness:.35})]));
  face.castShadow=true;g.add(face);
  for(const sx of [-0.65,0.65]){const post=new THREE.Mesh(new THREE.BoxGeometry(0.09,1.1,0.09),new THREE.MeshStandardMaterial({color:0x6b4a2a,metalness:.6,roughness:.4}));post.position.set(sx,-0.75,-0.05);g.add(post);}
  return g;
}

// ---------- house: metal block + glass dome + glowing windows
function house(scale=1,{holo=false,color=0xd8dde6}={}){
  const g=new THREE.Group();
  const mat=holo?new THREE.MeshBasicMaterial({color:0x6ff3ff,transparent:true,opacity:.18,depthWrite:false})
               :new THREE.MeshStandardMaterial({color,metalness:.85,roughness:.28});
  const base=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.7,1.0),mat);base.position.y=0.35;base.castShadow=!holo;g.add(base);
  const dome=new THREE.Mesh(new THREE.SphereGeometry(0.55,32,16,0,Math.PI*2,0,Math.PI/2),
    holo?mat:new THREE.MeshPhysicalMaterial({color:0xbfefff,metalness:0,roughness:.05,transmission:0,transparent:true,opacity:.45,clearcoat:1,emissive:0x2a6a88,emissiveIntensity:.4}));
  dome.position.y=0.7;g.add(dome);
  if(holo){const e=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.2,0.7,1.0)),new THREE.LineBasicMaterial({color:0x9ffbff}));e.position.y=0.35;g.add(e);}
  else{
    const win=new THREE.MeshStandardMaterial({color:0xffd27a,emissive:0xffb347,emissiveIntensity:1.6});
    for(const x of [-0.35,0,0.35]){const w=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.22,0.02),win);w.position.set(x,0.4,0.51);g.add(w);}
    const ant=new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,0.6),new THREE.MeshStandardMaterial({color:0xcccccc,metalness:1,roughness:.2}));ant.position.set(0.45,1.0,-0.2);g.add(ant);
    const tip=new THREE.Mesh(new THREE.SphereGeometry(0.05),new THREE.MeshStandardMaterial({color:0xff4d5e,emissive:0xff2030,emissiveIntensity:5}));tip.position.set(0.45,1.32,-0.2);g.add(tip);
    const pl=new THREE.PointLight(0xffb347,0.8,2.5,2);pl.position.set(0,0.5,0.9);g.add(pl);
  }
  g.scale.setScalar(scale);return g;
}
function greenhouse(holo=true){const g=new THREE.Group();
  const m=new THREE.MeshBasicMaterial({color:0x6ff3ff,transparent:true,opacity:.16,depthWrite:false});
  const tube=new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.45,1.0,24,1,false,0,Math.PI),m);tube.rotation.z=Math.PI/2;tube.position.y=0.02;g.add(tube);
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.CylinderGeometry(0.45,0.45,1.0,12,1,false,0,Math.PI)),new THREE.LineBasicMaterial({color:0x9ffbff}));e.rotation.z=Math.PI/2;g.add(e);return g;}

// ---------- gas giant with ring
function gasGiant(){
  const c=document.createElement('canvas');c.width=1024;c.height=512;const x=c.getContext('2d');
  for(let y=0;y<512;y++){const t=y/512;const h=0.07+0.05*Math.sin(t*40)+0.03*Math.sin(t*97);x.fillStyle=`hsl(${(h*360)|0},${55+20*Math.sin(t*23)}%,${45+12*Math.sin(t*61)}%)`;x.fillRect(0,y,1024,1);}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(60,64,32),new THREE.MeshStandardMaterial({map:t,roughness:1})));
  const ring=new THREE.Mesh(new THREE.RingGeometry(75,110,128),new THREE.MeshBasicMaterial({color:0xe8c9a0,side:THREE.DoubleSide,transparent:true,opacity:.35}));ring.rotation.x=Math.PI/2.3;g.add(ring);
  return g;
}

// ---------- sparks / dust
function particles(n,spread,center,color,size,opacity=1){
  const pos=new Float32Array(n*3);for(let i=0;i<n;i++){pos.set([center.x+(rnd()-.5)*spread.x,center.y+(rnd()-.5)*spread.y,center.z+(rnd()-.5)*spread.z],i*3);}
  const gm=new THREE.BufferGeometry();gm.setAttribute('position',new THREE.BufferAttribute(pos,3));
  return new THREE.Points(gm,new THREE.PointsMaterial({color,size,transparent:true,opacity,depthWrite:false,blending:THREE.AdditiveBlending}));
}

const ui=document.getElementById('ui');
let focus=8, bloomStrength=1.0, aperture=0.0006;
const project=(v)=>{const p=v.clone().project(cam);return [(p.x+1)/2*W,(1-p.y)/2*H];};

if(FRAME==='1'){
  // ХУК: метеорит замер перед камерой, табличка, остывающий шлейф
  const grp=new THREE.Group();const a=asteroid(2.2,0.2);a.rotation.set(0.25,0.6,0.1);grp.add(a);
  const s2=sign();s2.scale.setScalar(0.95);s2.position.set(0.1,1.3,1.0);s2.rotation.set(-0.05,-0.12,0.02);grp.add(s2);
  scene.add(grp);
  // хвост искр за метеоритом
  scene.add(particles(700,new THREE.Vector3(2.5,2.5,16),new THREE.Vector3(-1.5,2.5,-10),0xff9a3c,0.05,.8));
  scene.add(particles(300,new THREE.Vector3(5,6,5),new THREE.Vector3(0,0,0),0xfff1c2,0.035,.7));
  const gg=gasGiant();gg.position.set(-110,-40,-320);scene.add(gg);
  cam.position.set(0.6,2.2,9.0);cam.lookAt(0.1,0.6,0);focus=8.2;bloomStrength=0.7;
  ui.innerHTML=`<div class="plashka">МЕТЕОРИТОВ ЗАНЯТО: 1</div><div class="sub">ЭТО МОЙ <span class="y">МЕТЕОРИТ</span></div>`;
}
if(FRAME==='2'){
  // ТВОЙ ДОМ: метеорит зрителя, дом с ником, голограмма оранжереи, метеорит героя на фоне
  const a=asteroid(2.0,0.18,{lava:true});scene.add(a);
  const h=house(1.15);h.position.set(-0.3,0.72,0.1);h.rotation.y=0.35;scene.add(h);
  const gh=greenhouse();gh.position.set(1.15,0.95,-0.4);gh.rotation.y=0.4;scene.add(gh);
  const hero=asteroid(1.4,0.16,{lava:true});hero.position.set(-5.5,1.5,-7);scene.add(hero);
  const hh=house(0.8);hh.position.set(-5.6,2.0,-7);scene.add(hh);
  for(let i=0;i<7;i++){const e=asteroid(0.6+rnd()*0.7,0.14,{lava:rnd()>0.6});e.position.set((rnd()-.5)*26,(rnd()-.5)*8+1,-12-rnd()*18);scene.add(e);}
  const gg=gasGiant();gg.position.set(140,40,-380);scene.add(gg);
  scene.add(particles(500,new THREE.Vector3(12,10,10),new THREE.Vector3(0,1,-2),0xcfe8ff,0.03,.6));
  cam.position.set(1.4,3.0,8.0);cam.lookAt(-0.3,0.9,0);focus=7.9;bloomStrength=0.6;
  renderer.render(scene,cam);
  const [bx,by]=project(new THREE.Vector3(-0.3,2.35,0.1));
  ui.innerHTML=`<div class="plashka">КАК ПОЛУЧИТЬ МЕТЕОРИТ</div><div class="badge" style="left:${bx}px;top:${by}px">@твой_ник</div><div class="sub">ВЫРАСТЕТ <span class="g">ДОМ</span></div>`;
}
if(FRAME==='3'){
  // КУЛЬМИНАЦИЯ: пояс метеоритов с голограммами и станция на горизонте
  for(let i=0;i<16;i++){
    const r=0.7+rnd()*0.9;const e=asteroid(r,0.14,{lava:rnd()>0.5});
    const x=(rnd()-.5)*30,z=-4-rnd()*30,y=(rnd()-.5)*5-1-z*0.06;e.position.set(x,y,z);scene.add(e);
    const hcount=1+Math.floor(rnd()*3);
    for(let k=0;k<hcount;k++){const hh=house(r*0.45,{holo:i!==2});hh.position.set(x+(k-hcount/2+.5)*r*0.6,y+r*0.36,z);scene.add(hh);}
  }
  // станция-кольцо
  const st=new THREE.Group();
  const torus=new THREE.Mesh(new THREE.TorusGeometry(40,2.5,16,128),new THREE.MeshBasicMaterial({color:0x6ff3ff,transparent:true,opacity:.22}));st.add(torus);
  const tw=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.TorusGeometry(40,2.5,6,48)),new THREE.LineBasicMaterial({color:0xaffcff,transparent:true,opacity:.6}));st.add(tw);
  for(let i=0;i<10;i++){const ang=i/10*Math.PI*2;const sp=new THREE.Mesh(new THREE.BoxGeometry(2,14+rnd()*12,2),new THREE.MeshBasicMaterial({color:0x6ff3ff,transparent:true,opacity:.25}));sp.position.set(Math.cos(ang)*40,Math.sin(ang)*40,0);sp.rotation.z=ang-Math.PI/2;st.add(sp);}
  const core=new THREE.Mesh(new THREE.SphereGeometry(8,32,16),new THREE.MeshBasicMaterial({color:0xbffaff,transparent:true,opacity:.35}));st.add(core);
  st.add(particles(1500,new THREE.Vector3(90,90,6),new THREE.Vector3(0,0,0),0xffe7a8,0.6,.9));
  st.position.set(30,90,-380);st.rotation.set(1.2,0.15,0.25);scene.add(st);
  const gg=gasGiant();gg.position.set(-90,10,-520);gg.scale.setScalar(1.4);scene.add(gg);
  scene.add(particles(800,new THREE.Vector3(40,20,40),new THREE.Vector3(0,2,-15),0xcfe8ff,0.05,.5));
  cam.position.set(0,6,10);cam.lookAt(2,14,-60);focus=150;bloomStrength=0.75;aperture=0.00015;
  ui.innerHTML=`<div class="sub" style="top:1250px">БУДЕТ ЦЕЛАЯ <span class="y">СТАНЦИЯ</span></div>`;
}

const comp=new EffectComposer(renderer);
comp.addPass(new RenderPass(scene,cam));
comp.addPass(new BokehPass(scene,cam,{focus,aperture,maxblur:0.008}));
comp.addPass(new UnrealBloomPass(new THREE.Vector2(W/2,H/2),bloomStrength,0.45,0.9));
comp.addPass(new OutputPass());
comp.render();
window.__done=true;
</script></body></html>

    const crack=lava&&Math.abs(noise3(p.x*2.2+3,p.y*2.2,p.z*2.2-1))<0.022&&p.y<R*0.25;
    (crack?lavas:rocks).push(p);

  const im=new THREE.InstancedMesh(box,rockMat,rocks.length);im.castShadow=im.receiveShadow=true;
  const m=new THREE.Matrix4(),c=new THREE.Color();

    const t=0.5+0.5*noise3(p.x*3,p.y*3,p.z*3);const top=p.y>R*0.3;

  g.add(im);
  if(lavas.length){const lm=new THREE.MeshStandardMaterial({color:0xff7a1a,emissive:0xff5a00,emissiveIntensity:2.2,roughness:.5});
    const il=new THREE.InstancedMesh(box,lm,lavas.length);lavas.forEach((p,i)=>{m.makeScale(vox*1.02,vox*1.02,vox*1.02).setPosition(p);il.setMatrixAt(i,m);});g.add(il);

  const c0=new THREE.Vector3(0.6,2.2,9.0),c1=new THREE.Vector3(0.35,1.75,6.9);const cu=easeInOut((t-2.0)/2.0);
  camA.position.copy(c0).lerp(c1,cu);
  const shake=ts>0&&ts<0.35?Math.sin(ts*70)*0.06*(1-ts/0.35):0;camA.position.y+=shake;camA.position.x+=shake*0.5;
  camA.lookAt(lerp(0.1,0.1,cu),lerp(0.6,1.05,cu),0);
  return {cam:camA,scene:A,focus:camA.position.distanceTo(heroSign.getWorldPosition(new THREE.Vector3()))};
}

// ================= СЦЕНА B: пустой пояс (4.0–5.5) и whip-pan к пустому участку (5.5–6.0) =================
const B=new THREE.Scene();B.background=scene.background;B.environment=scene.environment;B.environmentIntensity=scene.environmentIntensity;
base.forEach(o=>{if(o.isLight||o.isPoints)B.add(o.clone());});
const heroB=asteroid(1.6,0.16);heroB.position.set(0,0,0);B.add(heroB);
const sB=signAnim('hero');sB.scale.setScalar(0.7);sB.position.set(0,1.0,0.5);B.add(sB);sB.userData.draw(0.6,1);
const warm=new THREE.PointLight(0xffb060,3,6,2);warm.position.set(0,1.5,1.2);B.add(warm);
const empties=[];
for(let i=0;i<22;i++){
  const r=0.6+rnd()*0.8;const e=asteroid(r,0.14,{lava:rnd()>0.75});
  let px,pz;do{px=(rnd()-.5)*26;pz=-2-rnd()*30;}while(Math.abs(px)<2.5&&pz>-5);e.position.set(px,(rnd()-.5)*3-0.8,pz);e.rotation.y=rnd()*3;B.add(e);
  for(let k=0;k<4;k++){const st=stake();const a2=k/4*Math.PI*2+0.4;st.position.set(e.position.x+Math.cos(a2)*r*0.55,e.position.y+r*0.35+0.17,e.position.z+Math.sin(a2)*r*0.55);B.add(st);}
  empties.push(e);
}
// пустой участок для whip-pan: справа от героя, крупно
const plot=asteroid(1.5,0.16,{lava:true});plot.position.set(14,0.5,-2);B.add(plot);
for(let k=0;k<4;k++){const st=stake();const a2=k/4*Math.PI*2+0.78;st.position.set(14+Math.cos(a2)*0.85,0.5+1.5*0.35+0.17,-2+Math.sin(a2)*0.85);B.add(st);}
const free=signAnim('free');free.scale.setScalar(0.7);free.position.set(14,1.75,-1.5);free.rotation.y=-0.35;B.add(free);
const ggB=gasGiant();ggB.position.set(120,20,-380);ggB.scale.setScalar(1.3);B.add(ggB);
B.add(particles(500,new THREE.Vector3(40,10,40),new THREE.Vector3(0,0,-6),0xcfe8ff,0.04,.45));
const camB=new THREE.PerspectiveCamera(40,W/H,0.1,2000);
function updateB(t){
  if(t<5.5){ // плавный отъезд и подъём над поясом
    const u=easeInOut((t-4.0)/1.5);
    camB.position.set(lerp(-1.0,-2.0,u),lerp(5.5,8.5,u),lerp(8,12,u));camB.lookAt(0.5,-1,-9);
    return {cam:camB,scene:B,focus:camB.position.distanceTo(new THREE.Vector3(0,0,0))};
  }
  // whip-pan вправо: 4 кадра (0.133 с) от общего плана к пустому участку
  const u=easeInOut((t-5.5)/0.133);
  const from=new THREE.Vector3(-2.0,8.5,12),to=new THREE.Vector3(11.0,2.6,4.2);
  const lookFrom=new THREE.Vector3(0.5,-1,-9),lookTo=new THREE.Vector3(14,1.1,-2);
  camB.position.copy(from).lerp(to,u);camB.lookAt(lookFrom.clone().lerp(lookTo,u));
  if(t>5.633){const v=(t-5.633)/0.4;camB.position.x+=v*0.25;}
  return {cam:camB,scene:B,focus:camB.position.distanceTo(new THREE.Vector3(14,1.1,-2))};
}

// ---------- субтитры по словам
const WORDS=[[0.15,0.9,'ЭТО МОЙ'],[0.9,1.95,'<span class="y">МЕТЕОРИТ</span>'],[2.0,2.6,'ЭКИПАЖ:'],[2.6,3.15,'ОДИН'],[3.3,4.0,'ЭТО Я'],
  [4.1,4.65,'ВОКРУГ'],[4.65,5.45,'ПУСТОЙ ПОЯС'],[5.55,6.1,'НИ СОСЕДЕЙ']];
function drawUI(t){
  const w=WORDS.find(([a,b])=>t>=a&&t<b);
  ui.innerHTML=`<div class="plashka">МЕТЕОРИТОВ ЗАНЯТО: 1</div>`+(w?`<div class="sub">${w[2]}</div>`:'');
}

// ---------- композер на каждую сцену
function makeComposer(sc,cm){const c=new EffectComposer(renderer);c.addPass(new RenderPass(sc,cm));
  const bok=new BokehPass(sc,cm,{focus:8,aperture:0.0005,maxblur:0.008});c.addPass(bok);
  c.addPass(new UnrealBloomPass(new THREE.Vector2(W/2,H/2),0.7,0.45,0.9));c.addPass(new OutputPass());c.bok=bok;return c;}
const compA=makeComposer(A,camA),compB=makeComposer(B,camB);
// накопление для motion blur
const acc=document.createElement('canvas');acc.width=W;acc.height=H;acc.style.cssText='position:absolute;inset:0;display:none';document.body.insertBefore(acc,document.getElementById('ui'));
const actx=acc.getContext('2d');
function renderOnce(t){const r=t<4.0?updateA(t):updateB(t);const comp=t<4.0?compA:compB;comp.bok.uniforms.focus.value=r.focus;comp.render();}
window.renderAt=(t)=>{
  const whip=t>=5.5&&t<5.66;
  if(whip||(t>=1.0&&t<1.6)){ // смаз при быстром движении
    const N=whip?8:4,dt=1/30;actx.clearRect(0,0,W,H);
    for(let i=0;i<N;i++){renderOnce(t+dt*i/N);actx.globalAlpha=1/(i+1);actx.drawImage(renderer.domElement,0,0);}
    actx.globalAlpha=1;acc.style.display='block';
  } else {acc.style.display='none';renderOnce(t);}
  drawUI(t);return true;
};
window.__ready=true;
</script></body></html>

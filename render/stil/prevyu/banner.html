const box=new THREE.BoxGeometry(1,1,1);
function asteroid(R=2.2,vox=0.22,{lava=true,flatTop=true}={}){
  const g=new THREE.Group();
  const rocks=[],lavas=[];const n=Math.ceil(R/vox)+1;
  for(let i=-n;i<=n;i++)for(let j=-n;j<=n;j++)for(let k=-n;k<=n;k++){
    const p=new THREE.Vector3(i,j,k).multiplyScalar(vox);
    let rr=R*(1+0.18*noise3(p.x*0.9,p.y*0.9,p.z*0.9));
    if(flatTop&&p.y>R*0.35) continue;           // ровная площадка сверху под постройки
    const d=p.length(); if(d>rr) continue;
    const topLayer=flatTop&&p.y>R*0.35-vox*1.01;
    if(d<rr-vox*1.8&&!topLayer) continue;       // оболочка + сплошная верхняя площадка
    const crack=lava&&Math.abs(noise3(p.x*2.2+3,p.y*2.2,p.z*2.2-1))<0.022&&p.y<R*0.25;
    (crack?lavas:rocks).push(p);
  }
  const rockMat=new THREE.MeshStandardMaterial({roughness:.92,metalness:.05,vertexColors:false,color:0xffffff});
  const im=new THREE.InstancedMesh(box,rockMat,rocks.length);im.castShadow=im.receiveShadow=true;
  const m=new THREE.Matrix4(),c=new THREE.Color();
  rocks.forEach((p,i)=>{m.makeScale(vox,vox,vox).setPosition(p);im.setMatrixAt(i,m);
    const t=0.5+0.5*noise3(p.x*3,p.y*3,p.z*3);const top=p.y>R*0.3;
    c.setHSL(top?0.08:0.66+0.04*t,top?0.22:0.16,top?0.47+0.07*t:0.26+0.08*t);im.setColorAt(i,c);});
  g.add(im);
  if(lavas.length){const lm=new THREE.MeshStandardMaterial({color:0xff7a1a,emissive:0xff5a00,emissiveIntensity:2.2,roughness:.5});
    const il=new THREE.InstancedMesh(box,lm,lavas.length);lavas.forEach((p,i)=>{m.makeScale(vox*1.02,vox*1.02,vox*1.02).setPosition(p);il.setMatrixAt(i,m);});g.add(il);
    const pl=new THREE.PointLight(0xff6a10,1.5,5,2);pl.position.set(0,-R*0.4,R*0.6);g.add(pl);}
  return g;
}

 [14.23,15.18,"один метеорит"],[15.46,16.32,"один житель"],[16.59,17.58,"вместе |с тобой"],[17.92,19.69,"подпишись |и напиши |комментарий"],
 [19.98,21.72,"этот метеорит |станет твоим"],[22.04,24.09,"сначала |вырастет дом |с твоим ником"],[24.36,25.68,"потом |оранжерея"],[25.96,26.52,"ангар"],
 [26.80,28.23,"или |телескоп-караоке"],[28.52,29.77,"напиши, |что построить"],[30.07,31.29,"а однажды |здесь…"],[31.56,33.21,"будет целая |станция"],
 [33.53,34.79,"позови друга |в соседи"],[35.05,36.84,"подпишись |и напиши |комментарий"],[37.08,39.73,"в следующей |серии |твой метеорит |с ником!"]];
const COL={'метеорит':'y','пиццы':'y','город':'y','с тобой':'g','подпишись':'r','комментарий':'r','станет твоим':'g','вырастет дом':'g','с твоим ником':'g','телескоп-караоке':'y','напиши,':'r','станция':'y','позови друга':'r','твой метеорит':'g','с ником!':'g'};
const vow=s=>(s.match(/[аеёиоуыэюя]/gi)||[]).length+0.5;
const CH=[];FR.forEach(([a,b,txt])=>{const parts=txt.split('|').map(s=>s.trim());const tot=parts.reduce((s,p)=>s+vow(p),0);let x=a;
  parts.forEach((p,i)=>{const d=(b-a)*vow(p)/tot;CH.push([x,i===parts.length-1?b+0.3:x+d,p]);x+=d;});});
for(let i=0;i<CH.length-1;i++)if(CH[i][1]>CH[i+1][0])CH[i][1]=CH[i+1][0];
function plaque(t){if(t<17.87)return 'МЕТЕОРИТОВ ЗАНЯТО: 1';if(t<30.02)return 'КАК ПОЛУЧИТЬ МЕТЕОРИТ';if(t<33.48)return '';if(t<35)return 'КТО СОСЕД?';return 'МЕТЕОРИТОВ ЗАНЯТО: 1 / 1 000 000';}
const pop=(t,t0)=>{const u=(t-t0)/0.17;return u<0?0:u<1?1.08*easeOut(u,2):u<1.4?lerp(1.08,1,(u-1)/0.4):1;};
function badge(cam,pos,text,t0,t,border='#45f08a'){const v=pos.clone().project(cam);if(v.z>1)return '';const s=pop(t,t0);if(!s)return '';
  return `<div class="badge" style="left:${(v.x+1)/2*W}px;top:${(1-v.y)/2*H}px;transform:translate(-50%,-100%) scale(${s});border-color:${border}">${text}</div>`;}
const pill=(top,text,bg,t,t0)=>{const s=pop(t,t0);return s?`<div class="cta" style="top:${top}px;background:${bg};transform:translateX(-50%) scale(${s});font-size:36px">${text}</div>`:'';};
function drawUI(t,r){
  const c=CH.find(([a,b])=>t>=a&&t<b);let sub='';
  if(c){sub=c[2];const k=Object.keys(COL).find(w=>sub===w||sub.endsWith(w)||sub.startsWith(w));if(k)sub=sub.replace(k,`<span class="${COL[k]}">${k}</span>`);}
  let h='';const p=plaque(t);if(p)h+=`<div class="plashka">${p}</div>`;
  if(c)h+=`<div class="sub" style="${t>=37.03?'top:1170px;font-size:100px;':''}white-space:nowrap">${sub}</div>`;
  if(r.scene===Wd){
    if(t>=14.18&&t<17.87){h+=badge(camW,NP.clone().add(V3(0,TOP(NR)+0.7,0)),'@???',14.6,t,'#9ffbff');h+=pill(1420,'1 МЕТЕОРИТ = 1 ЖИТЕЛЬ','#1d2a52',t,15.4);}
    if(t>=23.2&&t<30.02&&t<24.31)h+=badge(camW,VP.clone().add(V3(-0.85,VT-VP.y+2.0,0.35)),'@твой_ник',23.25,t);
    if(t>=24.31&&t<28.47)h+=pill(220,t<25.91?'ПОСТРОЕК: 2 / 3':'ПОСТРОЕК: 3 / 3','#1d2a52',t,t<25.91?24.4:25.95);
    if(t>=28.47&&t<30.02){h+=badge(camW,VP.clone().add(V3(-0.85,VT-VP.y+2.0,0.35)),'@твой_ник',28.47,t);h+=pill(1420,'НАПИШИ В КОММЕНТАРИЯХ, ЧТО ПОСТРОИТЬ ↓','#ff3b4f',t,28.6);}
    if(t>=33.48&&t<35){h+=badge(camW,NP.clone().add(V3(0,TOP(NR)+0.7,0)),'@друг?',33.6,t,'#ffd23f');h+=pill(1420,'ОТПРАВЬ ДРУГУ ➜','#ff3b4f',t,33.9);}
  } else if(t>=37.03){
    h+=pill(1320,'ПОДПИШИСЬ + КОММЕНТАРИЙ = ТВОЙ МЕТЕОРИТ','#ff3b4f',t,37.2);
    h+=`<div class="cta" style="top:1420px;background:#1d2a52;font-size:30px;transform:translateX(-50%) scale(${pop(t,37.6)})">СЕРИЯ 2: ТВОЙ ДОМ С НИКОМ</div>`;
  }
  ui.innerHTML=h;
}

// ======================= рендер =======================
const compA=makeComposer(A,camA),compW=makeComposer(Wd,camW);
const acc=document.createElement('canvas');acc.width=W;acc.height=H;acc.style.cssText='position:absolute;inset:0;display:none';document.body.insertBefore(acc,ui);
const actx=acc.getContext('2d');
const useA=t=>t<4.58||t>=35;
function renderOnce(t){const r=useA(t)?updateA(t):updateW(t);const comp=useA(t)?compA:compW;comp.bok.uniforms.focus.value=r.focus;comp.render();return r;}
const WHIPS=[6.63,7.62,8.82,24.31,25.91,26.75];
window.renderAt=(t)=>{
  const whip=WHIPS.some(w=>t>=w&&t<w+0.16);let r;
  if(whip||(t>=0.4&&t<0.8)){const N=whip?8:4,dt=1/30;actx.clearRect(0,0,W,H);
    for(let i=0;i<N;i++){r=renderOnce(t+dt*i/N);actx.globalAlpha=1/(i+1);actx.drawImage(renderer.domElement,0,0);}
    actx.globalAlpha=1;acc.style.display='block';
  } else {acc.style.display='none';r=renderOnce(t);}
  drawUI(t,r);return true;
};
window.cover=()=>{
  const t=15.0;updateW(t);
  vHouse.visible=true;vHouse.scale.set(1,1,1);vGreen.visible=true;vGreen.scale.setScalar(1);vBusy.visible=true;vFree.visible=false;
  vHangar.visible=false;vScope.visible=false;belt.forEach(b=>{b.h.visible=true;b.h.scale.setScalar(b.r*.45);});grid.material.opacity=0;drone.visible=false;
  flag.visible=true;flag.scale.y=1;
  GW.position.set(1.0,TOP(HR),0.9);GW.rotation.set(0,0.35,0);pose(GW,'wave',0.4,'proud');GW.userData.ant.material.emissiveIntensity=6;
  camW.fov=38;camW.updateProjectionMatrix();camW.position.set(2.5,1.55,4.7);camW.lookAt(0.4,2.25,-1.0);
  compW.bok.uniforms.focus.value=camW.position.distanceTo(GW.position);compW.render();ui.innerHTML='';acc.style.display='none';};
window.avatar=()=>{
  updateW(15.0);
  belt.forEach(b=>{b.h.visible=false;});grid.material.opacity=0;drone.visible=false;flag.visible=true;flag.scale.y=1;
  GW.scale.setScalar(1.55);GW.position.set(0.9,TOP(HR),1.1);GW.rotation.set(0,0.45,0);pose(GW,'wave',0.3,'joy');GW.userData.ant.material.emissiveIntensity=6;
  hLava.forEach(m=>m.emissiveIntensity=2.4);
  Wd.children.forEach(o=>{if(!o.isLight&&!o.isPoints&&o!==ggW&&o.position.length()>3.5)o.visible=false;});
  ggW.visible=false;
  camW.fov=40;camW.updateProjectionMatrix();camW.position.set(7.0,4.4,13.2);camW.lookAt(0,0.35,0);
  compW.bok.uniforms.focus.value=camW.position.distanceTo(V3(0,0.9,0));compW.render();ui.innerHTML='';acc.style.display='none';};
window.banner=()=>{
  updateW(15.0);
  vHouse.visible=true;vHouse.scale.set(1,1,1);vGreen.visible=true;vGreen.scale.setScalar(1);vHangar.visible=true;vScope.visible=false;vBusy.visible=true;vFree.visible=false;
  belt.forEach(b=>{b.h.visible=true;b.h.scale.setScalar(b.r*.45);});grid.material.opacity=0;drone.visible=false;notes.material.opacity=0;flag.visible=true;flag.scale.y=1;
  GW.scale.setScalar(1.3);GW.position.set(1.0,TOP(HR),1.1);GW.rotation.set(0,-0.25,0);pose(GW,'wave',0.3,'joy');GW.userData.ant.material.emissiveIntensity=6;
  camW.fov=34;camW.aspect=W/H;camW.updateProjectionMatrix();camW.position.set(-2.1,3.0,12.5);camW.lookAt(-2.2,1.75,0);
  compW.bok.uniforms.focus.value=camW.position.distanceTo(V3(0,1,0));compW.render();ui.innerHTML='';acc.style.display='none';};
window.__ready=true;

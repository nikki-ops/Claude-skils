<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Серия 11 · Захват</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#141829;--tq:#4fd6e8;--gold:#ffd860;--red:#ff5a6a;--imen:#a64dff;--city:#3fa8ff;--tg:#2aabee}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0b0a10;font-family:Rubik,sans-serif}
#map{position:absolute;inset:0;width:1080px;height:1920px;border:0}
.o{position:absolute;left:0;right:0;text-align:center;pointer-events:none;will-change:transform}
#vg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(20,8,4,0) 45%,rgba(20,8,4,.42) 100%)}
#flash{position:absolute;inset:0;background:#fff3d0;opacity:0;pointer-events:none}
/* субтитры: 1–2 слова, толстая обводка, цвет только у ключевого слова */
#sub{top:1250px;font-weight:900;font-size:118px;line-height:1.05;color:#fff;text-transform:lowercase;-webkit-text-stroke:18px var(--ink);paint-order:stroke fill;text-shadow:0 12px 0 var(--ink),0 0 30px rgba(20,24,41,.6)}
#sub.tq{color:var(--tq)}#sub.gold{color:var(--gold)}#sub.red{color:var(--red)}#sub.imen{color:#d49bff}
/* верхняя плашка */
#plq{top:300px}#plq span{display:inline-block;color:#fff;font-weight:900;font-size:66px;line-height:1.15;padding:16px 44px;border-radius:22px;border:5px solid #fff;background:linear-gradient(#222845,#141829);max-width:940px}
#plq.red span{background:#d8263a}#plq.imen span{background:#7b2fbe}#plq.blue span{background:#1f6fd6}#plq.gold span{background:#f7c24a;color:#1a1410;border-color:#fff}
#plq b{color:var(--gold)}#plq .c{color:#7cc4ff}#plq .p{color:#d49bff}#plq.big span{font-size:150px;padding:4px 70px}
#cnt{top:300px}#cnt span{display:inline-block;background:linear-gradient(#222845,#141829);color:#fff;font-weight:900;font-size:80px;padding:18px 50px;border-radius:26px;border:6px solid var(--imen)}#cnt b{color:#d49bff}
/* ник над домом: крупно, ≥ 24 px */
#nick{left:0;top:0;right:auto;width:auto;transform-origin:50% 100%}#nick span{display:inline-block;white-space:nowrap;background:#fff;color:var(--ink);font-weight:900;font-size:64px;padding:10px 38px;border-radius:60px;border:7px solid var(--imen);box-shadow:0 12px 0 rgba(0,0,0,.25)}
#nick.gold span{border-color:#f7c24a;box-shadow:0 0 40px 10px rgba(247,194,74,.85),0 12px 0 rgba(0,0,0,.25)}#nick.city span{border-color:var(--city)}
/* телефон с картой в Telegram: экран прозрачный — сквозь него живая карта */
#tg{left:130px;width:788px;top:250px;height:980px;border:16px solid #1b1f2e;border-radius:80px;box-shadow:0 0 0 3000px rgba(8,10,20,.62),0 30px 80px rgba(0,0,0,.5);overflow:hidden;text-align:left;right:auto}
#tg .hd{background:var(--tg);color:#fff;padding:52px 40px 26px;font-weight:900;font-size:46px}#tg .hd small{display:block;font-weight:700;font-size:30px;opacity:.9;margin-top:4px}
#tg .sr{margin:22px 30px;background:#fff;border-radius:40px;padding:20px 34px;font-weight:700;font-size:44px;color:#141829;box-shadow:0 6px 0 rgba(0,0,0,.18)}#tg .sr i{display:inline-block;width:4px;height:44px;background:#141829;vertical-align:middle;margin-left:4px}
/* выбор: две кнопки выше 70 % высоты */
#vote{top:640px}#vote .in{display:inline-block;width:860px;box-sizing:border-box;background:#fff;border-radius:30px;padding:24px 36px;text-align:left;font-weight:700;font-size:52px;color:#141829;border:6px solid #141829;margin-bottom:36px}#vote .in em{font-style:normal;color:#8a8fa3}#vote .in i{display:inline-block;width:5px;height:52px;background:#141829;vertical-align:middle;margin-left:4px}
#vote .bs{display:flex;gap:30px;justify-content:center}#vote .b{width:420px;padding:44px 0;border-radius:36px;color:#fff;font-weight:900;font-size:64px;border:7px solid #fff;box-shadow:0 14px 0 rgba(0,0,0,.3)}
#vote .b.d{background:#1f6fd6}#vote .b.j{background:#7b2fbe}
/* лайк = +1 щит */
#like{top:470px}#like .sh{position:relative;display:inline-block;width:380px;height:440px}
#like .sh svg{position:absolute;inset:0}#like .pl{font-weight:900;font-size:90px;color:#fff;-webkit-text-stroke:12px var(--ink);paint-order:stroke fill;margin-top:10px}
.hrt{position:absolute;font-size:110px;left:0;top:0}
/* комментарий */
#cmt{top:600px}#cmt .c{padding:40px 60px!important;gap:36px!important}#cmt .c{display:inline-flex;align-items:center;gap:28px;background:#fff;border-radius:40px;padding:30px 46px;box-shadow:0 16px 0 rgba(0,0,0,.3);text-align:left}
#cmt .a{width:150px;height:150px;border-radius:50%;background:#f7c24a;display:flex;align-items:center;justify-content:center;font-size:84px}
#cmt .n{font-weight:700;font-size:58px;color:#5a5f74}#cmt .t{font-weight:900;font-size:124px;color:#1f6fd6}
/* плашка Telegram в финале — выше нижней зоны интерфейса */
#tgp{top:560px}#tgp span{display:inline-block;background:var(--tg);color:#fff;font-weight:900;font-size:54px;padding:18px 40px;border-radius:24px;border:5px solid #fff;box-shadow:0 10px 0 #1a7fb3}
</style></head><body>

<div class="o" id="cnt"><span></span></div>
<div class="o" id="nick"><span></span></div>
<div class="o" id="vote"><div class="in" id="vin"></div><div class="bs"><div class="b d" id="vb1">🛡 ЗАЩИТИТЬ</div><div class="b j" id="vb2">🚩 ВСТУПИТЬ</div></div></div>
<div class="o" id="like"><div class="sh"><svg viewBox="0 0 380 440"><defs><clipPath id="shc"><path d="M190 10 L360 70 L350 230 C340 330 270 400 190 430 C110 400 40 330 30 230 L20 70 Z"/></clipPath></defs>
<path d="M190 10 L360 70 L350 230 C340 330 270 400 190 430 C110 400 40 330 30 230 L20 70 Z" fill="#141829"/>

<path d="M190 10 L360 70 L350 230 C340 330 270 400 190 430 C110 400 40 330 30 230 L20 70 Z" fill="none" stroke="#fff" stroke-width="16"/>
<text x="190" y="270" text-anchor="middle" font-family="Rubik" font-weight="900" font-size="150" fill="#fff">🛡</text></svg></div><div class="pl" id="lpl">+1</div></div>
<div class="o" id="cmt"><div class="c"><div class="a">🏠</div><div><div class="n">@yo_meepo</div><div class="t">ЗАЩИТИТЬ</div></div></div></div>

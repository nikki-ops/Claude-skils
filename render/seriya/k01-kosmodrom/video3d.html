<script>
// Серия 1 в 3D (Three.js r128, low-poly как MARS CITY). window.seek(t) ставит сцену и камеру на секунду t.
const S=SER,W=S.W,H=S.H,T=THREE,ease=S.ease,seg=S.seg;
const R=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});R.setPixelRatio(1);R.setSize(W,H);document.body.prepend(R.domElement);
const {sc,sun}=KM.stepScene(R,{});const hemi=sc.children.find(o=>o.isHemisphereLight);const cam=new T.PerspectiveCamera(48,W/H,.1,900);
const B=KM.B,C=KM.C,M=KM.M,V=(a,b,c)=>new T.Vector3(a,b,c),lerp=(a,b,k)=>a+(b-a)*k,lv=(a,b,k)=>V(lerp(a[0],b[0],k),lerp(a[1],b[1],k),lerp(a[2],b[2],k));

// ---------- мир: космодром ----------

const crow=KM.vorona();crow.scale.setScalar(1.8);sc.add(crow);

const sklad=new T.Group();B(sklad,16,9,12,0x3a3440,0,4.5,0);const roof=new T.Mesh(new T.ConeGeometry(12,4,4),M(0x2a2430));roof.position.y=11;roof.rotation.y=Math.PI/4;sklad.add(roof);
const win=new T.Mesh(new T.PlaneGeometry(3,2),new T.MeshBasicMaterial({color:0x141018}));win.position.set(3,6,6.05);sklad.add(win);B(sklad,4,6,.2,0x141018,-3,3,6.05);sklad.position.set(26,0,-14);sklad.rotation.y=-.5;sc.add(sklad);

const marks=[];for(let i=0;i<14;i++){const m=new T.Mesh(new T.PlaneGeometry(3,.4),new T.MeshBasicMaterial({color:0xf4efe6}));m.rotation.x=-Math.PI/2;m.position.set(-39+i*6,.08,32);sc.add(m);marks.push(m)}
function tractorM(){const g=new T.Group();B(g,4,1.8,2.4,0x2f6fd0,0,1.6,0);B(g,2,2.2,2.2,0x2f6fd0,-.6,3.4,0);B(g,1.6,1.2,2.3,0x8fd2ff,-.6,3.5,0);[[-1.4,1.3],[1.4,.9]].forEach(a=>[-1.3,1.3].forEach(z=>{const w=C(g,a[1],a[1],.6,0x2a2a2e,a[0],a[1],z,14);w.rotation.x=Math.PI/2}));return g}

// ---------- ангар (далеко в стороне) ----------

const hLamp=new T.SpotLight(0xffe0b0,0,45,.5,.6);hLamp.position.set(HX-6,13,9);hLamp.target.position.set(HX,0,1);sc.add(hLamp);sc.add(hLamp.target);
const battery=new T.Group();B(battery,1,1.5,.8,0x3a3f48,0,0,0);B(battery,.4,.3,.3,0xd8b04a,0,.9,0);sc.add(battery);
// робот Ключ: один экземпляр, переставляется по сценам; тексты экрана кэшируются
const kluch=KM.kluch({text:':)'});sc.add(kluch);const TX={};function screen(t){const s=S.screen(t);if(kluch.userData.cur===s)return;kluch.userData.cur=s;const m=kluch.userData.scr.material;m.map=TX[s]||(TX[s]=KM.screenTex(s));m.needsUpdate=true}
// ---------- кабинет: договор и сейф ----------
const OX=600,desk=new T.Group();B(desk,30,1,18,0x5a3a2a,0,-.5,0);
const paperTex=KM.canvasTex(800,1000,(x,w,h)=>{x.fillStyle='#f4eedf';x.fillRect(0,0,w,h);x.fillStyle='#2a2a3a';x.font='900 80px Rubik, Arial Black';x.textAlign='center';x.fillText('ДОГОВОР',w/2,120);x.font='900 34px Rubik';x.fillStyle='#5a5a6a';x.fillText('КОСМОДРОМ «РАССВЕТ» — 1 ₽',w/2,185);x.fillStyle='#bcb3a0';for(let i=0;i<10;i++)x.fillRect(80,260+i*60,i%3==2?420:640,14)});
const paper=new T.Mesh(new T.PlaneGeometry(8,10),new T.MeshBasicMaterial({map:paperTex}));paper.rotation.x=-Math.PI/2;paper.position.y=.02;desk.add(paper);
const stampTex=KM.canvasTex(700,180,(x,w,h)=>{x.strokeStyle='#d8263a';x.lineWidth=14;x.strokeRect(10,10,w-20,h-20);x.fillStyle='#d8263a';x.font='900 66px Rubik, Arial Black';x.textAlign='center';x.textBaseline='middle';x.fillText('ШТРАФ 50 000 000 ₽',w/2,h/2+4)});
const stamp=new T.Mesh(new T.PlaneGeometry(7,1.8),new T.MeshBasicMaterial({map:stampTex,transparent:true}));stamp.rotation.x=-Math.PI/2;stamp.rotation.z=.18;stamp.position.set(0,.05,2.6);desk.add(stamp);
const stamper=new T.Group();C(stamper,.5,.5,2,0x5a3a2a,0,1.5,0);C(stamper,1.2,1.2,.6,0x3a2a20,0,.3,0);desk.add(stamper);
desk.position.set(OX,0,0);sc.add(desk);const seryi=KM.seryi();seryi.position.set(OX+7,-.5,-6);seryi.rotation.y=-.4;seryi.scale.setScalar(2);sc.add(seryi);
const safeG=new T.Group();B(safeG,6,.5,4,0x6a5a4a,0,.25,0);B(safeG,6,.5,4,0x6a5a4a,0,5.75,0);B(safeG,.5,6,4,0x6a5a4a,-2.75,3,0);B(safeG,.5,6,4,0x6a5a4a,2.75,3,0);B(safeG,6,6,.4,0x5a4a3a,0,3,-1.8);B(safeG,5,5,.2,0x2a2420,0,3,-1.6);for(let r=0;r<3;r++)for(let c=0;c<4;c++)B(safeG,1,1.2,1.4,0x3f9a4a,-1.65+c*1.1,1.2+r*1.5,1.2);
const door=new T.Group();B(door,5,5,.5,0x7a6a5a,2.5,0,0);C(door,.9,.9,.3,0x9a8a7a,2.5,0,.35,20).rotation.x=Math.PI/2;door.position.set(-2.5,3,2.3);safeG.add(door);safeG.position.set(-200,0,0);sc.add(safeG);
// ---------- выбор: два двигателя ----------
function engine(rust){const g=new T.Group();C(g,1.1,1.1,2.6,rust?0x7a4a2a:0xc8ccd2,0,4.3,0,16);C(g,1.3,1.1,.4,rust?0x5a3a22:0x8a8d92,0,5.8,0,16);const n=new T.Mesh(new T.ConeGeometry(1.7,2.8,16,1,true),M(rust?0x5a3a22:0x8a8d92));n.material.side=T.DoubleSide;n.position.y=1.6;g.add(n);for(let i=0;i<6;i++)C(g,.1,.1,2.8,rust?0x6a3a1a:0xd8b04a,Math.cos(i)*1.15,4.3,Math.sin(i)*1.15,6);return g}
const E1=engine(1),E2=engine(0);E1.position.set(-900,0,0);E1.rotation.z=.25;sc.add(E1);E2.position.set(900,0,0);sc.add(E2);for(let i=0;i<16;i++)B(sc,1+i%3*.5,.6+i%2*.6,1.2,[0x6a4a3a,0x5a5e66,0x8a4a2a][i%3],-900+Math.cos(i*2.4)*(3+i*.25),.4,Math.sin(i*2.4)*3-1).rotation.y=i;
B(sc,8,.3,6,0xe8ecf2,900,.15,0);const seryi2=KM.seryi();seryi2.position.set(903.5,0,.5);seryi2.rotation.y=-.5;sc.add(seryi2);
const c1=new T.PerspectiveCamera(42,W/(H/2),.1,500),c2=new T.PerspectiveCamera(42,W/(H/2),.1,500);
// имя ракеты: табличка с мигающим курсором
const nameTex=[0,1].map(k=>KM.canvasTex(512,160,(x,w,h)=>{x.clearRect(0,0,w,h);x.fillStyle='rgba(216,40,58,.25)';x.font='900 120px Rubik';x.textAlign='center';x.textBaseline='middle';x.fillText('?',w/2,h/2);if(k){x.fillStyle='#d8283a';x.fillRect(w/2+50,h-40,70,16)}}));
const namePl=new T.Mesh(new T.PlaneGeometry(2.6,.8),new T.MeshBasicMaterial({map:nameTex[0],transparent:true}));sc.add(namePl);
// ---------- сцены ----------
let mode=1;const night=k=>{const d=1-.8*k;hemi.intensity=.8*d;sun.intensity=1.1*d;document.body.style.background=k>.5?'linear-gradient(#05050f,#1e1430 60%,#3a2a2a)':'linear-gradient(#3b2a6e 0%,#b2507a 45%,#f39a4f 75%,#ffd28a 100%)';sc.fog.color.set(k>.5?0x120c1c:0xe0866a)};
function base(){mode=1;night(0);LAMPS.forEach(l=>l.intensity=0);lampMat.color.set(0x3a3020);hLamp.intensity=0;
 rocket.position.set(0,1.6,0);rocket.rotation.set(0,0,Math.PI/2);crow.position.set(-6,3.25,0);crow.rotation.set(0,1.3,0);crow.visible=true;coin.position.set(-3.5,1.7,2);coin.rotation.set(Math.PI/2-.3,0,0);
 gen.position.set(12,0,9);tractor.position.set(-60,0,32);weeds.forEach(w=>w.visible=true);marks.forEach(m=>m.visible=false);cable.visible=false;kluch.visible=false;battery.visible=false;namePl.visible=false;hatchM.visible=false;win.material.color.set(0x141018);kluch.rotation.set(0,0,0);kluch.scale.setScalar(1);kluch.userData.head.rotation.set(0,0,0)}
const SCN={
hook(t,u){coin.position.set(-3.5,t<1.5?lerp(14,1.7,ease(t/1.5)**1.5):1.7+Math.abs(Math.sin((t-1.5)*9))*1.2*Math.max(0,1-(t-1.5)*2),2);coin.rotation.set(Math.PI/2-.3,Math.sin(t*4)*.25,0);crow.position.y=3.25+Math.sin(t*5)*.05;look(lv([-1,7,34],[-2,6.5,30],u),V(-4,4,0))},
cond(t,u){look(lv([-2,6.5,30],[8,12,46],ease(u)),lv([-4,4,0],[-4,9,-4],ease(u)))},
fine(t,u){const d=ease(seg(t,7.6,8));stamper.position.set(0,lerp(8,0,d),2.6);stamp.visible=t>=8;stamp.material.opacity=Math.min(1,(t-8)*4);look(V(OX+lerp(-1,0,u),17-u*2,9),V(OX,0,.5))},
safe(t,u){door.rotation.y=-ease(seg(t,10.2,11))*1.9;look(V(-200+lerp(5,3,u),5.5,17-u*2),V(-200,3,0))},
gen(t,u){gen.position.y=t<14.6?lerp(24,0,ease(seg(t,13.6,14.6))**2):Math.abs(Math.sin((t-14.6)*10))*.5*Math.max(0,1-(t-14.6)*2);const lit=ease(seg(t,16.3,16.7));LAMPS.forEach(l=>l.intensity=.9*lit);lampMat.color.set(lit>.5?0xfff3c0:0x3a3020);
 look(lv([28,8,32],[20,7,28],u),V(2,6,0))},
tractor(t,u){const tx=lerp(-50,46,ease(seg(t,18.4,21.2)));tractor.position.set(tx,0,32);weeds.forEach(w=>w.visible=w.position.x>tx+1);marks.forEach(m=>m.visible=t>20&&m.position.x<tx-3);look(V(tx-12,7,50),V(tx+2,1,32))},
hangar(t,u){hLamp.intensity=1.6;night(.85);const rise=ease(seg(t,27,28.4));kluch.visible=t>=26.8||rise>0;kluch.position.set(HX+.6,lerp(-3.5,0,rise),1.4);kluch.rotation.y=-.25;
 if(t>=25&&t<26.2){battery.visible=true;const b=seg(t,25,25.7);battery.position.set(HX-6+b*6,lerp(9,1.4,b),3)}
 scrapG.children.forEach((c,i)=>{c.position.y=(c.userData.y0??(c.userData.y0=c.position.y))+(t>25.6&&t<27?Math.abs(Math.sin(t*30+i))*.15:0)});
 kluch.userData.scr.material.color.setHex(t<26.8?0x223040:0xffffff);look(lv([HX-4,4.4,14],[HX-2.5,4,11],u),V(HX+.3,2.6,0))},
crane(t,u){const k=ease(seg(t,35.2,37.6));rocket.position.set(0,lerp(1.6,1.2,k),0);rocket.rotation.z=(Math.PI/2)*(1-k);
 crow.visible=t<38.5;if(t>36){crow.position.set(-6+(t-36)*-5,3.25+(t-36)*6,0)}else crow.position.set(-6*Math.cos((Math.PI/2)*k),3.25,0);
 cable.visible=t>34;const top=V(-Math.sin(rocket.rotation.z)*15,rocket.position.y+Math.cos(rocket.rotation.z)*15,0),tip=V(14,26,4);cable.position.copy(top.clone().add(tip).multiplyScalar(.5));cable.scale.y=top.distanceTo(tip);cable.lookAt(tip);cable.rotateX(Math.PI/2);
 kluch.visible=true;kluch.position.set(7,1.2,7);kluch.rotation.y=-.6;kluch.scale.setScalar(.9);look(lv([20,8,40],[16,12,42],u),V(0,8,0))},
hatch(t,u){rocket.position.set(0,1.2,0);rocket.rotation.z=0;crow.visible=false;kluch.visible=true;kluch.position.set(-3.5,1.2,4.5);kluch.rotation.y=.6;
 kluch.userData.head.rotation.z=t>45&&t<46?Math.sin(t*30)*.08:0;kluch.userData.scr.material.color.setHex(t>=45?0xff8a8a:0xffffff);hatchM.visible=t>42.8;look(lv([-10,4.2,20],[-9,4,18],u),V(-1.5,2.6,0))},
choice(t,u){mode=2;const s1=ease(seg(t,53,53.6)),s2=ease(seg(t,60,60.6));E1.position.x=-900-(1-s1)*20;E2.position.x=900+(1-s2)*20;seryi2.position.x=903.5+(1-s2)*20;
 c1.position.set(-905,4,11);c1.lookAt(-900,3,0);c2.position.set(895,4.5,11);c2.lookAt(901,1.4,0)},
name(t,u){rocket.position.set(0,1.2,0);rocket.rotation.z=0;crow.visible=false;namePl.visible=true;namePl.position.set(0,7.2,1.65);namePl.material.map=nameTex[Math.floor(t*2.5)%2];look(V(0,7.2,lerp(6,5,u)),V(0,7.2,0))},
night(t,u){night(1);rocket.position.set(0,1.2,0);rocket.rotation.z=0;crow.visible=false;LAMPS.forEach(l=>l.intensity=1.2);lampMat.color.set(0xfff3c0);
 win.material.color.set(t>76&&(Math.floor(t*7)%3!==0)?0xffe89a:0x141018);kluch.visible=true;kluch.position.set(8,1.2,8);kluch.rotation.y=t>75.2?-1.1:-.4;
 const e=ease(seg(t,78,79.2));look(lv([-6,7,30],[6,4.8,14.5],e),lv([10,4,-2],[8.3,4.4,8],e));if(t>=82.6){hemi.intensity=.1}}
};
UI.init(document.getElementById('ov'),W,H);
window.seek=t=>{base();const s=S.scene(t);if(s.id==='name'||s.id==='choice')cam.clearViewOffset();else cam.setViewOffset(W,H,0,150,W,H);coin.visible=t<7;SCN[s.id](t,s.u);screen(t);if(mode===2){R.setScissorTest(true);R.setViewport(0,H/2,W,H/2);R.setScissor(0,H/2,W,H/2);R.render(sc,c1);R.setViewport(0,0,W,H/2);R.setScissor(0,0,W,H/2);R.render(sc,c2);R.setScissorTest(false);R.setViewport(0,0,W,H)}else R.render(sc,cam);
 UI.update(t,S);chUI(t)};
// подписи выбора 1/2 поверх (как в 2D)
const ch=document.createElement('div');ch.style.cssText='position:absolute;inset:0;pointer-events:none;font-family:Rubik,sans-serif';document.getElementById('ov').appendChild(ch);

 ch.innerHTML=`<div style="position:absolute;left:0;right:0;top:${H/2-6}px;height:12px;background:#fff"></div>${a1?'':`<div style="position:absolute;left:0;right:0;top:0;height:${H/2}px;background:rgba(10,8,20,.55)"></div>`}${a2?'':`<div style="position:absolute;left:0;right:0;top:${H/2}px;height:${H/2}px;background:rgba(10,8,20,.55)"></div>`}
 <div style="position:absolute;left:60px;top:470px;font-weight:900;font-size:170px;color:#f7c24a;-webkit-text-stroke:12px #1b1426;paint-order:stroke fill">1</div><div style="position:absolute;left:60px;top:1030px;font-weight:900;font-size:170px;color:#4fd6e8;-webkit-text-stroke:12px #1b1426;paint-order:stroke fill">2</div>
 ${t>=53.3?pl(H*.405,'СТАРЫЙ 1991 г. · 3 МЛН'):''}${t>=60.3?pl(1310,'НОВЫЙ В КРЕДИТ · 20 МЛН'):''}`}
window.END=S.END;Promise.all([document.fonts.load('900 40px Rubik'),document.fonts.load('700 40px Rubik')]).then(()=>{seek(0);window.READY=1});
</script></body></html>

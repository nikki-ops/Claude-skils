<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>1 лайк = 1 этаж</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;background:#0b0d1a;font-family:Rubik,'Arial Black',Arial,sans-serif;font-weight:900}
#map{position:absolute;left:0;top:0;width:1080px;height:1920px;border:0}
.L{position:absolute;inset:0;pointer-events:none}
#shade{background:linear-gradient(rgba(10,12,30,.55),rgba(10,12,30,0) 18%,rgba(10,12,30,0) 70%,rgba(10,12,30,.6))}
#head{position:absolute;left:0;right:0;top:200px;text-align:center;color:#ffd23a;font-size:92px;line-height:1;-webkit-text-stroke:14px #000;paint-order:stroke fill;white-space:nowrap}
#head small{display:block;color:#fff;font-size:62px;-webkit-text-stroke:11px #000;margin-top:14px}
#cnt{position:absolute;left:50%;top:1370px;transform:translate(-50%,0);background:#1a1d36;border:8px solid #ffd23a;border-radius:48px;color:#fff;font-size:92px;padding:10px 50px;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.5);transform-origin:50% 50%}
#cnt b{color:#ffd23a}
#nick{position:absolute;left:50%;top:1525px;transform:translateX(-50%);color:#fff;font-size:58px;-webkit-text-stroke:10px #000;paint-order:stroke fill;white-space:nowrap}
#you{position:absolute;left:50%;top:1380px;transform:translate(-50%,-50%) scale(0);background:#5dff8a;color:#0d2a14;border:8px solid #fff;border-radius:40px;padding:16px 46px;text-align:center;font-size:96px;line-height:1.02;white-space:nowrap;box-shadow:0 0 60px 20px rgba(93,255,138,.55)}
#you small{display:block;font-size:50px;margin-top:6px}
#bait{position:absolute;left:50%;top:470px;transform:translateX(-50%);background:rgba(20,22,40,.82);color:#fff;font-size:44px;padding:10px 30px;border-radius:26px;white-space:nowrap;border:4px solid #ffd23a}
#cloud{position:absolute;inset:-200px;pointer-events:none;background:radial-gradient(circle at 30% 40%,#fff 0 18%,transparent 34%),radial-gradient(circle at 70% 55%,#fff 0 20%,transparent 36%),radial-gradient(circle at 45% 70%,#fff 0 22%,transparent 38%),radial-gradient(circle at 60% 25%,#fff 0 16%,transparent 32%),#f4f8ff;opacity:0}
</style></head><body>
<div id="stage">
 <iframe id="map" src="../../karta/index.html?video"></iframe>
 <div class="L" id="shade"></div>
 <div id="head">1 ЛАЙК = 1 ЭТАЖ 👍<small>каждый этаж — ник жителя</small></div>
 <div id="cnt">ЭТАЖ <b id="cn">0</b></div>
 <div id="nick"></div>
 <div id="bait">👀 на крыше кто-то сидит…</div>
 <div id="you">ТВОЙ ЭТАЖ?<small>лайк + ник в комменты 👇</small></div>
<div id="cloud"></div>
</div>
<script>
// Шортс «1 лайк = 1 этаж» (≈12,5 с = 20 долей при 96 BPM, петля). Карта render/karta/index.html не меняется — башня добавляется в её сцену из iframe.
const W=1080,H=1920,BEAT=60/96,DUR=20*BEAT,CX=162,CZ=-84,FH=3.1,FW=9;
const $=id=>document.getElementById(id);
let cw,THREE,sc,cam,R,TOWER,FLOORS=[],TOP,SIGN,NICKS=[];
// расписание этажей: доли 1–4 по одному, 5–8 по 2, 9–13 по 4, 14–17 по 8 → ровно в ритм
const TF=[];{let b=0;const add=(n,per)=>{for(let i=0;i<n;i++)for(let k=0;k<per;k++)TF.push(.05+(b+i+k/per)*BEAT);b+=n};add(4,1);add(4,2);add(5,4);add(4,8)}
const NF=TF.length,T_END=.05+17*BEAT;// после 17-й доли — верхушка «ТВОЙ ЭТАЖ?»
const cl=(x,a,b)=>Math.max(a,Math.min(b,x)),sm=(a,b,x)=>{const k=cl((x-a)/(b-a),0,1);return k*k*(3-2*k)},lerp=(a,b,k)=>a+(b-a)*k;
let SEED=7;const rnd=()=>{SEED=(SEED*16807)%2147483647;return (SEED-1)/2147483646};
const PAL=['#f4efe6','#ffd23a','#6ab3f3','#e8503a','#5dff8a','#c58cff','#ff9a3c','#f7f7f7'];
function texNick(n,bg){const c=cw.document.createElement('canvas');c.width=512;c.height=96;const x=c.getContext('2d');x.fillStyle='#1d2a44';x.fillRect(0,0,512,96);x.fillStyle='#ffd23a';x.font='900 52px Rubik, Arial Black, Arial';x.textAlign='center';x.textBaseline='middle';let s='@'+n;while(x.measureText(s).width>480&&s.length>4)s=s.slice(0,-2)+'…';x.fillText(s,256,52);const t=new THREE.CanvasTexture(c);return t}
function floor(i,n){const g=new THREE.Group();const col=new THREE.Color(PAL[i%PAL.length]);
 const body=new THREE.Mesh(new THREE.BoxGeometry(FW,FH-.35,FW),new THREE.MeshLambertMaterial({color:col}));body.position.y=(FH-.35)/2;g.add(body);
 const slab=new THREE.Mesh(new THREE.BoxGeometry(FW+.6,.35,FW+.6),new THREE.MeshLambertMaterial({color:0x5a5560}));slab.position.y=FH-.175;g.add(slab);
 const wm=new THREE.MeshBasicMaterial({color:i%5===2?0xffe7a0:0x2a3a5c});
 for(let s=0;s<4;s++){const a=s*Math.PI/2;for(let k=-1;k<=1;k++){if(s===0&&k===0)continue;const w=new THREE.Mesh(new THREE.BoxGeometry(1.7,1.4,.12),wm);w.position.set(Math.sin(a)*(FW/2+.02)+Math.cos(a)*k*2.8,1.45,Math.cos(a)*(FW/2+.02)-Math.sin(a)*k*2.8);w.rotation.y=a;g.add(w)}}
 const lb=new THREE.Mesh(new THREE.PlaneGeometry(6.6,1.25),new THREE.MeshBasicMaterial({map:texNick(n)}));lb.position.set(0,1.45,FW/2+.08);g.add(lb);
 g.position.set(CX,i*FH,CZ);g.visible=false;sc.add(g);return g}
function signTex(){const c=cw.document.createElement('canvas');c.width=512;c.height=256;const x=c.getContext('2d');x.fillStyle='#5dff8a';x.fillRect(0,0,512,256);x.strokeStyle='#fff';x.lineWidth=16;x.strokeRect(8,8,496,240);x.fillStyle='#0d2a14';x.font='900 84px Rubik, Arial Black, Arial';x.textAlign='center';x.fillText('ТВОЙ',256,112);x.fillText('ЭТАЖ?',256,206);return new THREE.CanvasTexture(c)}
function build(){TOWER=new THREE.Group();sc.add(TOWER);
 const L=cw.MP.L.filter(h=>h.n&&!h.site&&!h.bld&&!h.anon&&/^[A-Za-zА-Яа-яЁё0-9_.\-]{4,14}$/.test(h.n));const pick=[];const used=new Set();while(pick.length<NF){const h=L[Math.floor(rnd()*L.length)];if(!used.has(h.n)){used.add(h.n);pick.push(h.n)}}NICKS=pick;
 const base=new THREE.Mesh(new THREE.BoxGeometry(FW*2,.3,FW*2),new THREE.MeshLambertMaterial({color:0xe6dcc4}));base.position.set(CX,.15,CZ);sc.add(base);
 for(let i=0;i<NF;i++)FLOORS.push(floor(i,NICKS[i]));
 // верхушка: пустая площадка с пунктиром и табличкой
 TOP=new THREE.Group();const pad=new THREE.Mesh(new THREE.BoxGeometry(FW+.6,.35,FW+.6),new THREE.MeshLambertMaterial({color:0x5a5560}));pad.position.y=.17;TOP.add(pad);
 const ed=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(FW,FH-.4,FW)),new THREE.LineDashedMaterial({color:0x5dff8a,dashSize:.8,gapSize:.5}));ed.computeLineDistances();ed.position.y=.35+(FH-.4)/2;TOP.add(ed);
 
 // крошечный кот-мэр на углу верхушки (приманка — виден только в конце)
 const cat=new THREE.Group(),cm=new THREE.MeshLambertMaterial({color:0xf2a23a}),dk=new THREE.MeshLambertMaterial({color:0x2a1a10}),wh=new THREE.MeshLambertMaterial({color:0xfff4e0});
 const B=(g,w,h,d,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);g.add(o);return o};
 B(cat,.55,.5,.75,cm,0,.25,0);B(cat,.5,.45,.45,cm,0,.72,.22);B(cat,.12,.16,.08,cm,-.15,1.0,.22);B(cat,.12,.16,.08,cm,.15,1.0,.22);B(cat,.07,.07,.02,dk,-.1,.78,.45);B(cat,.07,.07,.02,dk,.1,.78,.45);B(cat,.18,.08,.03,wh,0,.64,.45);
 const tail=B(cat,.1,.1,.5,cm,0,.4,-.5);tail.rotation.x=-.8;const paw=new THREE.Group();paw.position.set(.3,.5,.2);cat.add(paw);B(paw,.12,.4,.12,cm,0,.2,0);
 const tie=B(cat,.08,.25,.02,new THREE.MeshLambertMaterial({color:0xd8202a}),0,.35,.38);
 cat.position.set(FW/2-.9,.35,FW/2-.9);cat.rotation.y=.5;cat.scale.setScalar(1.15);TOP.add(cat);TOP.userData.paw=paw;
 TOP.position.set(CX,NF*FH,CZ);TOP.visible=false;sc.add(TOP);
 // убрать всё, что стоит на месте башни (только мелкие объекты, склеенные районы не трогаем)
 const fb=new THREE.Box3(new THREE.Vector3(CX-FW,-1,CZ-FW),new THREE.Vector3(CX+FW,60,CZ+FW)),bb=new THREE.Box3(),sz=new THREE.Vector3();let hid=0;
 sc.updateMatrixWorld(true);const skip=new Set([TOWER,TOP,base,...FLOORS]);
 sc.traverse(o=>{if(!o.visible||skip.has(o)||o===sc)return;let p=o;while(p){if(skip.has(p))return;p=p.parent}if(!(o.isMesh||o.isGroup))return;bb.setFromObject(o);if(bb.isEmpty())return;bb.getSize(sz);if(sz.x>30||sz.z>30)return;if(bb.intersectsBox(fb)&&bb.min.y<40){o.visible=false;hid++}});
 console.log('[башня] убрано объектов:',hid)}
// высота верхушки к моменту t
function topY(t){let n=0;for(const x of TF)if(t>=x)n++;return n*FH}
function seek(t){t=((t%DUR)+DUR)%DUR;let n=0;
 FLOORS.forEach((f,i)=>{const t0=TF[i],on=t>=t0;f.visible=on;if(on){n++;const d=i<4?.22:i<12?.14:.09,k=cl((t-t0)/d,0,1);const bo=(1-k)*(1-k);f.position.y=i*FH+bo*FH*2.2;const sq=k<1?1+.12*Math.sin(k*Math.PI):1;f.scale.set(sq,1/sq,sq)}});
 const end=t>=T_END;TOP.visible=end;if(end){const k=cl((t-T_END)/.18,0,1);TOP.position.y=NF*FH+(1-k)*(1-k)*FH*2;}
 // камера: следит за верхушкой, плавно отъезжает и облетает
 const ty=Math.max(0,topY(t)-FH*.5),k1=sm(0,T_END,t),yaw=lerp(-.25,.55,k1)+Math.sin(t*.9)*.03,dist=lerp(34,58,sm(2.2,T_END,t))-sm(T_END,T_END+.8,t)*30,up=dist*.6;
 let sy=0;if(n>0){const lt=TF[n-1],a=cl((t-lt)/.15,0,1);sy=(1-a)*(n<5?.5:.18)*Math.sin(a*20)}
 const T_UP=DUR-.55,kin=1-sm(0,.45,t),kup=sm(T_UP,DUR,t);
 cam.position.set(CX+Math.sin(yaw)*dist,ty+up+sy+kin*14+kup*10,CZ+Math.cos(yaw)*dist);cam.fov=lerp(55,50,k1);cam.updateProjectionMatrix();cam.lookAt(CX,ty+1+kup*60,CZ);
 if(end&&TOP.userData.paw)TOP.userData.paw.rotation.z=t>T_END+.5?-2.2+Math.sin(t*14)*.5:0;
 $('cloud').style.opacity=Math.max(kin,kup).toFixed(3);$('bait').style.display=t<T_END?'block':'none';
 R.render(sc,cam);
 // надписи
 const shown=end?NF:n;$('cn').textContent=shown;const pul=n>0?cl((t-TF[n-1])/.12,0,1):1;$('cnt').style.transform=`translate(-50%,0) scale(${1+(1-pul)*.12})`;
 $('nick').textContent=(!end&&n>0)?'@'+NICKS[n-1]:'';$('nick').style.display=n>0&&n<=12&&!end?'block':'none';
 const yk=sm(T_END,T_END+.25,t);$('you').style.transform=`translate(-50%,-50%) scale(${yk*(1+Math.sin(t*10)*.03*yk)})`;$('cnt').style.display=end?'none':'block'}
function sfxList(){const L=[];TF.forEach((x,i)=>L.push([x+(i<4?.2:i<12?.12:.08),i<12?'pop':'tick',i<4?1:i<12?.8:.5]));L.push([T_END,'whoosh',.8]);L.push([T_END+.18,'ding',1]);L.push([T_END+.5,'pop',.7]);L.push([DUR-.5,'swish',.8]);return L}
function fit(){if(document.body.classList.contains('render'))return;const k=Math.min(innerWidth/W,innerHeight/H);$('stage').style.transform=`scale(${k})`;$('stage').style.left=(innerWidth-W*k)/2+'px'}
addEventListener('resize',fit);fit();if(/[?&]render/.test(location.search)){document.body.classList.add('render');$('stage').style.transform='none'}
$('map').addEventListener('load',()=>{cw=$('map').contentWindow;const iv=setInterval(()=>{if(!cw.MP)return;clearInterval(iv);
 try{THREE=cw.THREE;sc=cw.eval('sc');cam=cw.eval('cam');R=cw.eval('R');cw.requestAnimationFrame=()=>0;
  const st=cw.document.createElement('style');st.textContent='.o:not(canvas),.bub,.pn,.mp,#mpTop,#mpCtl,#mpBot,#mpEye,#sys,button{display:none!important}';cw.document.head.appendChild(st);
  cw.MP.draw();sc.traverse(o=>{if(o.isSprite)o.visible=false});build();seek(0);window.READY=true}catch(e){console.error(e);window.SCENE_ERR=e.message+' '+(e.stack||'')}},200)});
// просмотр в браузере: пробел — проигрывание
let play=null;addEventListener('keydown',e=>{if(e.key!==' '||!window.READY)return;if(play){cancelAnimationFrame(play);play=null;return}const t0=performance.now();const lp=()=>{seek((performance.now()-t0)/1000);play=requestAnimationFrame(lp)};lp()});
window.seek=seek;window.sfxList=sfxList;window.DUR=DUR;window.vkey=t=>'k'+Math.round(t*30);
</script></body></html>

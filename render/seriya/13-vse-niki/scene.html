const pop=(t,t0,d)=>{d=d||.22;const u=(t-t0)/d;return u<0?0:u>=1?1:u<.6?1.18*eout(u/.6):1.18-.18*ease((u-.6)/.4)};

function plan(){const evs=(window.T13&&T13.ev)||[{t:(CFG.SECRET_FRAME-1)*CFG.FRAME,gold:1,hold:1}];
 for(let tries=0;tries<9;tries++){const c0=RES[0];setCam(c0.x,c0.z);
  let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;RES.forEach(h=>{x0=Math.min(x0,h.x);x1=Math.max(x1,h.x);z0=Math.min(z0,h.z);z1=Math.max(z1,h.z)});
  const C=[];for(let cx=x0-40;cx<=x1+40;cx+=16)for(let cz=z0-60;cz<=z1+60;cz+=16){const S=visSet(cx,cz);if(S.length)C.push({cx,cz,S})}

   if(ev.n){const h=RES.find(o=>o.n===ev.n);if(!h){console.warn('нет дома',ev.n);return}f={cx:h.x,cz:h.z,id:id++};f.S=visSet(f.cx,f.cz)}
   else if(ev.east){const e=C.filter(c=>c.S.length>=12).reduce((a,b)=>b.cx>a.cx?b:a);f=Object.assign({},e,{id:id++})}

  const left=new Set(RES.map((_,i)=>i).filter(i=>!pre.has(i))),pick=[];
  while(left.size){let best=null,bn=0;for(const c of C){let m=0;for(const i of c.S)if(left.has(i))m++;if(m>bn){bn=m;best=c}}if(!best)break;best.S.forEach(i=>left.delete(i));pick.push(best)}

  const ord=[];let last=If;while(pick.length){let k=0,bd=1e9;pick.forEach((p,i)=>{const d=Math.hypot(p.cx-last.cx,p.cz-last.cz);if(d<bd){bd=d;k=i}});last=pick.splice(k,1)[0];ord.push(last)}

 const box=$('labs');box.innerHTML='';const vis=[];LABS=[];

 const tw=vis.filter(v=>v[0].hid);if(tw.length){const ax=tw.reduce((a,v)=>a+v[3][0],0)/tw.length,ay=Math.min(...tw.map(v=>v[3][1]));tw.sort((a,b)=>a[0].n.localeCompare(b[0].n));tw.forEach((v,k)=>{v[1]=ax;v[2]=labY(ax,ay-10-k*46,ay)})}
 let sec=null;if(sl&&sl.gold){vis.slice().sort((a,b)=>Math.hypot(a[1]-540,a[2]-800)-Math.hypot(b[1]-540,b[2]-800)).some(v=>{if(!/UTOPAN/i.test(v[0].n)){sec=v;return true}})}
 const placed=[];vis.sort((a,b)=>a[2]-b[2]);vis.forEach(v=>{const [h,x,y]=v,e=document.createElement('div'),t='@'+h.n;let fs=fitFont(t,MC);

 [0.0,'Вы спрашивали...'],[0.8,'почему <y>вас нет?</y>'],[1.6,'Вот <y>ВСЕ 1 434!</y>'],
 [(CFG.SECRET_FRAME-1)*CFG.FRAME,'Смотри — <y>СЕКРЕТ!</y>'],[(CFG.SECRET_FRAME-1)*CFG.FRAME+0.8,'Лови свой <y>ник</y>'],[(CFG.SECRET_FRAME-1)*CFG.FRAME+1.6,'на <g>ПАУЗЕ!</g>']];
 if(F>=20){// полная версия: крючок каждые ~4 с, каждый — две строки субтитров (текст = озвучка)
  const mid=[['Твой дом <y>точно здесь</y>...','смотри <g>внимательно</g>'],['Видишь себя?','Пиши <g>«НАШЁЛ»</g>!'],['Не моргай...','тут каждый кадр — <y>новые соседи</y>'],
   ['Скинь <g>другу</g>...','пусть найдёт <y>себя!</y>'],['Ищи свой <y>ник</y>...','он мелькнёт <y>на миг</y>'],['Нашёл <y>друга?</y>','<g>Отметь</g> его в комментах!'],['Почти <y>все</y> на месте...','осталось <y>чуть-чуть!</y>']];
  const st=Math.max(4,(F-8)/mid.length);let t=6;mid.forEach(m=>{if(t<F-2.6){S.push([t,m[0]],[t+st/2,m[1]]);t+=st}})}
 S.push([F-1.4,'Нашёл <y>секрет?</y> Пиши <g>секунду!</g>'],[F,'Не успел <y>поймать?</y>'],[F+1.2,'Залетай в наш <g>ТГ</g>'],[F+2.4,'ссылка <y>в шапке</y> профиля'],
  [F+3.8,'вбей <y>ник</y> —'],[F+4.8,'и карта найдёт <y>твой дом!</y>'],[F+6.2,'Тут <y>ВСЕ!</y>'],[F+CFG.PHONE_SEC-CFG.LOOP_SEC,'Ведь...']);// петля: «...ведь» → «Вы спрашивали...»
 return S.sort((a,b)=>a[0]-b[0])}
let SUBS=subs();
function place(){const B=document.getElementById('bot'),S=document.getElementById('sub');B.style.top=(CFG.SUB_Y-40)+'px';S.style.top=CFG.SUB_Y+'px'}
// ---------- карта в iframe ----------
let BLV='',MAPC=null,cw,MP,THREE,cam,RES=[],FR=[],COVER=null,SECRET=null,TARGET=null,cur=-1;
function frameStyles(){const d=cw.document,s=d.createElement('style');

function proj(x,y,z){const v=new THREE.Vector3(x,y,z).project(cam);return [(v.x*.5+.5)*W,(-v.y*.5+.5)*H,v.z]}
const lab=h=>Math.min((h.top||6)+.8,18);
// дом подписан в кадре, если его основание в окне карты (между плашками) и подпись не за краем
const BAND=()=>[CFG.SUB_Y+20,CFG.SUB_Y+170];// плотная часть полосы — дома под ней не видны
const INWIN=(bx,by)=>{const B=BAND();return bx>=12&&bx<=1068&&by>=20&&by<=1900&&!(by>B[0]&&by<B[1])};

function cover(){// жадное покрытие: минимум кадров, чтобы КАЖДЫЙ ник был подписан хотя бы в одном кадре

 let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;RES.forEach(h=>{x0=Math.min(x0,h.x);x1=Math.max(x1,h.x);z0=Math.min(z0,h.z);z1=Math.max(z1,h.z)});

  RES.forEach((h,i)=>{if(Math.abs(h.x-cx)>140||Math.abs(h.z-cz)>200)return;const b=proj(h.x-cx+c0.x,0,h.z-cz+c0.z);if(INWIN(b[0],b[1]))S.push(i)});if(S.length)C.push({cx,cz,S})}

 while(left.size){let best=null,bn=0;for(const c of C){let n=0;for(const i of c.S)if(left.has(i))n++;if(n>bn||(n===bn&&best&&c.S.length>best.S.length)){bn=n;best=c}}if(!best)break;best.S.forEach(i=>left.delete(i));pick.push(best)}
 // порядок: от самого плотного, дальше — ближайший сосед (жёсткие склейки, но район меняется плавно)

 const flat=c=>c.S.reduce((a,i)=>a+((RES[i].top||6)<10&&!RES[i].hid?1:-3),0);pick.sort((a,b)=>flat(b)-flat(a));const ord=[pick.shift()];while(pick.length){const l=ord[ord.length-1];let k=0,bd=1e9;pick.forEach((p,i)=>{const d=Math.hypot(p.cx-l.cx,p.cz-l.cz);if(d<bd){bd=d;k=i}});ord.push(pick.splice(k,1)[0])}
 const seen=new Set(),tc={};ord.forEach((f,i)=>{f.cum=0;f.S.forEach(j=>{if(!seen.has(j)){seen.add(j);tc[RES[j].n]=+(i*CFG.FRAME).toFixed(1)}});f.cum=seen.size});

function visSet(cx,cz){const c0=RES[0],S=[];RES.forEach((h,i)=>{if(Math.abs(h.x-cx)>140||Math.abs(h.z-cz)>200)return;const b=proj(h.x-cx+c0.x,0,h.z-cz+c0.z);if(INWIN(b[0],b[1]))S.push(i)});return S}

let SCHED=[];
function buildSched(){const n=Math.ceil(FLY()/CFG.FRAME-1e-6),sl=new Array(n).fill(null),c0=RES[0];setCam(c0.x,c0.z);
 const evs=(window.T13&&T13.ev)||[{t:(CFG.SECRET_FRAME-1)*CFG.FRAME,gold:1,hold:1}];let id=1000;
 evs.forEach(ev=>{const k0=Math.floor(ev.t/CFG.FRAME+1e-6);let f=null;
  if(ev.n){const h=RES.find(o=>o.n===ev.n);if(!h){console.warn('нет дома',ev.n);return}f={cx:h.x,cz:h.z,id:id++,h}}
  else if(ev.east){f=Object.assign({},FR.reduce((a,b)=>b.cx>a.cx?b:a),{id:id++})}
  if(f)f.S=visSet(f.cx,f.cz);
  for(let j=0;j<(ev.hold||1)&&k0+j<n;j++)sl[k0+j]={f,ev,gold:!!ev.gold}});
 let q=0;FR.forEach((f,i)=>f.id=i);
 for(let k=0;k<n;k++){if(!sl[k])sl[k]={f:null,ev:null};if(!sl[k].f){sl[k].f=FR[q%FR.length];q++}}

function fitFont(t,cx){const MW=158;let f=32;for(;f>=21;f--){cx.font='900 '+f+'px Rubik,Arial Black';if(cx.measureText(t).width<=MW)break}return f}

 RES.forEach(h=>{if(Math.abs(h.x-f.cx)>140||Math.abs(h.z-f.cz)>200)return;const b=proj(h.x,0,h.z);if(!INWIN(b[0],b[1])||b[2]>1)return;const p=proj(h.x,lab(h),h.z);vis.push([h,p[0],labY(p[0],p[1],b[1]),b])});

 const tw=vis.filter(v=>v[0].hid);if(tw.length){const ax=tw.reduce((a,v)=>a+v[3][0],0)/tw.length,ay=Math.min(...tw.map(v=>v[3][1]));tw.sort((a,b)=>a[0].n.localeCompare(b[0].n));tw.forEach((v,k)=>{v[1]=ax;v[2]=labY(ax,ay-10-k*46,ay)})}

 SECRET=null;const placed=[];vis.sort((a,b)=>a[2]-b[2]);vis.forEach(v=>{const [h,x,y]=v,e=document.createElement('div'),t='@'+h.n;let fs=fitFont(t,MC);

  const w=e.offsetWidth,hh=e.offsetHeight,B=BAND(),hit=Y=>placed.some(r=>X-w/2<r[2]+4&&X+w/2>r[0]-4&&Y-hh<r[3]+3&&Y>r[1]-3),okY=Y=>Y-hh>=8&&Y<=1912&&!(Y>B[0]-4&&Y-hh<B[1]+46)&&!(X+w/2>170&&X-w/2<910&&Y-hh<170);

// ---------- главный кадр: seek(t) детерминированно рисует момент t ----------
function seek(t){const F=FLY(),P=t-F;
 // субтитры
 let s='';for(const q of SUBS)if(q[0]<=t+1e-6)s=q[1];const UP=P>=0&&P<PH.back0;$('sub').innerHTML=s;$('sub').classList.toggle('up',UP);$('sub').style.top=UP?'250px':CFG.SUB_Y+'px';$('bot').style.top=(CFG.SUB_Y-40)+'px';
 if(P<0){// пролёт
  $('map').style.filter='';$('map').style.visibility='';$('blur').style.display='none';$('phone').style.display='none';$('cta').style.display='none';['labs','cnt','top','bot'].forEach(id=>{$(id).style.display='';$(id).style.opacity=1});
  const fi=Math.floor(t/CFG.FRAME+1e-6);showFrame(fi);
  // особый дом: быстрый зум (0,25 с) к дому + стрелка с подписью
  const sl=SCHED[Math.min(fi,SCHED.length-1)];let zs=1;$('arw').style.display='none';
  if(sl.ev&&!sl.gold&&SPEC){const dt=t-sl.ev.t,u=ease(dt/0.25);zs=1+0.18*u;
   const W_=$('world');W_.style.transformOrigin=SPEC.x+'px '+SPEC.y+'px';
   const a=$('arw'),pop=dt<0.3?0.5+0.62*ease(dt/0.3)-0.12*seg(dt,0.2,0.3):1;a.style.display='block';a.querySelector('b').textContent=sl.ev.lab||'';
   const ax=SPEC.x+(SPEC.lx-SPEC.x)*zs,ay=SPEC.y+(SPEC.lt-SPEC.y)*zs-6;a.style.left=Math.max(200,Math.min(880,ax))+'px';a.style.top=Math.max(330,ay)+'px';a.style.transform=`translate(-50%,-100%) scale(${pop})`;a.style.transformOrigin='50% 100%'}
  $('world').style.transform=zs>1.0001?`scale(${zs})`:'';
  const on=SECRET&&Math.floor(t*5)%2===0;$('tag').style.display=SECRET?'block':'none';$('ring').style.display=SECRET?'block':'none';
  if(SECRET){const r=SECRET.e.getBoundingClientRect(),sr=ST.getBoundingClientRect(),k=sr.width/W;$('tag').style.left=((r.left-sr.left)/k+r.width/k/2)+'px';$('tag').style.top=((r.top-sr.top)/k-14)+'px';$('tag').style.opacity=on?1:.25;
   const R=150;Object.assign($('ring').style,{left:SECRET.b[0]+'px',top:(SECRET.b[1]-30)+'px',width:R+'px',height:R+'px',opacity:on?1:.45})}
 }else{// финал: блюр, телефон, Telegram, поиск ника, пин; в конце — возврат к кадру 1 (петля)
  const u=ease(seg(P,PH.back0,PH.back1));
  $('tag').style.display='none';$('ring').style.display='none';$('arw').style.display='none';$('world').style.transform='';
  if(u>0){showFrame(0);['labs','cnt','bot'].forEach(id=>{$(id).style.display='';$(id).style.opacity=u})}else{['labs','cnt','bot'].forEach(id=>{$(id).style.display='none';$(id).style.opacity=1})}
  // размытый стоп-кадр карты: считается один раз на уровень размытия (быстро, без живого WebGL под фильтром)
  const b=ease(seg(P,0,.6))*(1-u);
  if(b>0.001){const lv=Math.max(1,Math.round(b*8))/8,key=lv+'|'+cur;if(BLV!==key&&MAPC){BLV=key;const c=$('blur').getContext('2d');c.filter=`blur(${10*lv}px) brightness(${1-.5*lv})`;c.clearRect(0,0,1080,1920);c.drawImage(MAPC,0,0,1080,1920);c.filter='none'}
   $('blur').style.display='block';$('map').style.visibility='hidden';$('labs').style.visibility=u>0?'hidden':''}
  else{$('blur').style.display='none';$('map').style.visibility='';$('labs').style.visibility=''}
  const ph=$('phone');ph.style.display=u>=1?'none':'block';ph.style.top=(1920-(1920-470)*ease(seg(P,0,.8))*(1-u))+'px';
  const nick='@'+TARGET.n,k=Math.floor(nick.length*seg(P,PH.type0,PH.type1));$('q').textContent=nick.slice(0,k);$('qph').style.display=k?'none':'';
  $('phone').querySelector('.car').style.opacity=Math.floor(P*3)%2?0:1;
  const zz=ease(seg(P,PH.zoom0,PH.zoom1));drawMini(1+zz*7,MB[4]+(TARGET.x-MB[4])*zz,MB[5]+(TARGET.z-MB[5])*zz,P>PH.pin?P-PH.pin:0);
  const c=seg(P,PH.cta,PH.cta+.5)*(1-u);$('cta').style.display=c>0?'block':'none';$('cta').style.opacity=c;$('cta').style.transform=`translateX(-50%) translateY(${(1-c)*40+Math.sin(P*6)*6}px)`}}

 RES=MP.L.filter(h=>!h.site&&!h.bld&&!h.anon&&h.n&&h.g);

 if(COVER.missing.length)console.warn('не попали:',COVER.missing);
 let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;RES.forEach(h=>{x0=Math.min(x0,h.x);x1=Math.max(x1,h.x);z0=Math.min(z0,h.z);z1=Math.max(z1,h.z)});MB=[x0,x1,z0,z1,(x0+x1)/2,(z0+z1)/2];

 if(document.body.classList.contains('render'))$('hint').style.display='none';window.DUR=DUR();window.READY=true}catch(e){console.error('сцена:',e);$('hint').textContent='Ошибка: '+e.message;window.SCENE_ERR=e.message}},200)});

let play=null;function start(){$('hint').style.display='none';document.body.classList.add('rec');cur=-1;const t0=performance.now();
 if(play)cancelAnimationFrame(play);const loop=()=>{const t=(performance.now()-t0)/1000;if(t>DUR()){seek(DUR()-.01);document.body.classList.remove('rec');play=null;return}seek(t);play=requestAnimationFrame(loop)};loop()}

window.vkey=t=>{const P=t-FLY();let si=-1;SUBS.forEach((q,k)=>{if(q[0]<=t+1e-6)si=k});
 if(P<0){const i=Math.floor(t/CFG.FRAME+1e-6),sl=SCHED[Math.min(i,SCHED.length-1)];let x='';

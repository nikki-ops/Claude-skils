<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Серия 11 · 777 домов</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#141829;--tq:#4fd6e8;--gold:#f7c24a;--red:#ff3b4f;--grn:#45f08a}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0b0a10;font-family:Rubik,sans-serif}
#map{position:absolute;inset:0;width:1080px;height:1920px;border:0;transition:none}
.o{position:absolute;left:0;right:0;text-align:center;pointer-events:none}
#day{top:150px}#day span{display:inline-block;background:linear-gradient(#222845,#141829);color:#fff;font-weight:900;font-size:58px;padding:14px 44px;border-radius:60px;border:5px solid #fff;letter-spacing:2px}

#sub.tq{color:var(--tq)}#sub.gold{color:var(--gold)}#sub.red{color:var(--red)}#sub.grn{color:var(--grn)}
#cnt{top:330px}#cnt span{display:inline-block;background:linear-gradient(#222845,#141829);color:#fff;font-weight:900;font-size:76px;padding:18px 50px;border-radius:26px;border:5px solid var(--gold)}#cnt b{color:var(--gold)}
#plq{top:300px}#plq span{display:inline-block;background:#2f8f4a;color:#fff;font-weight:900;font-size:56px;padding:14px 40px;border-radius:18px;border:5px solid #fff}
#badge{top:700px}#badge span{display:inline-block;background:#fff;color:var(--ink);font-weight:900;font-size:84px;padding:12px 46px;border-radius:70px;border:8px solid var(--grn);box-shadow:0 14px 0 rgba(0,0,0,.25)}
#phone{left:290px;width:500px;height:900px;top:330px;border-radius:70px;background:#0e1020;border:14px solid #2a2e44;box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden;text-align:left}
#phone .scr{position:absolute;inset:0;background:#fff;padding:60px 34px;font-family:Rubik;font-weight:700;color:#141829}
#phone .h{font-size:40px;font-weight:900;margin-bottom:10px}#phone .m{font-size:26px;color:#7a7f94;margin-bottom:30px}
#phone .btn{display:block;text-align:center;font-size:40px;font-weight:900;color:#fff;background:var(--red);border-radius:20px;padding:22px;margin:20px 0;box-shadow:0 8px 0 #a01a2a}
#phone .btn.on{background:#d8dce4;color:#5a5f74;box-shadow:0 8px 0 #a8acb8}
#phone .cm{margin-top:40px;font-size:30px;border:4px solid #e0e3ea;border-radius:20px;padding:22px;min-height:120px}
#phone .cm i{display:inline-block;width:4px;height:34px;background:#141829;vertical-align:middle;margin-left:3px}
#cta{top:1500px}#cta span{display:inline-block;background:var(--red);color:#fff;font-weight:900;font-size:58px;padding:24px 50px;border-radius:24px;box-shadow:0 12px 0 #a01a2a}
#pause{top:180px}#pause span{display:inline-block;background:rgba(20,24,41,.85);color:#fff;font-weight:900;font-size:70px;padding:14px 46px;border-radius:24px}
#flash{position:absolute;inset:0;background:#ffe9a8;opacity:0;pointer-events:none}
#gold{top:520px}#gold span{display:inline-block;font-size:220px;filter:drop-shadow(0 0 40px #f7c24a)}
</style></head><body>
<iframe id="map" src="../../karta/index.html?video"></iframe>
<div id="flash"></div>
<div class="o" id="day"><span>ДЕНЬ 10</span></div>
<div class="o" id="cnt"><span>ЖИТЕЛЕЙ: <b>777</b></span></div>
<div class="o" id="plq"><span>ПО ПРОСЬБЕ ЖИТЕЛЕЙ</span></div>
<div class="o" id="pause"><span>⏸ НАЙДИ СЕБЯ</span></div>
<div class="o" id="badge"><span>@твой_ник</span></div>
<div class="o" id="gold"><span>🏠</span></div>
<div class="o" id="phone"><div class="scr"><div class="h">gorodpodpiscikov</div><div class="m">город на Марсе · 777 жителей</div><div class="btn" id="pbtn">Подписаться</div><div class="m" style="margin:40px 0 0">Комментарии</div><div class="cm" id="pcm"></div></div></div>
<div class="o" id="cta"><span>ПИШИ: НИК + ЧТО ПОСТРОИТЬ</span></div>
<div class="o" id="sub"></div>
<script src="seriya.js"></script>
</body></html>

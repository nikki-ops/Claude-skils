<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Район башни</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;background:#0b0d1a;font-family:Rubik,'Arial Black',Arial,sans-serif;font-weight:900}
#map{position:absolute;left:0;top:0;width:1080px;height:1920px;border:0}
#shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(10,12,30,.5),rgba(10,12,30,0) 20%,rgba(10,12,30,0) 68%,rgba(10,12,30,.6))}
.big{position:absolute;left:0;right:0;top:250px;text-align:center;font-size:112px;line-height:.95;color:#ffd23a;-webkit-text-stroke:20px #000;paint-order:stroke fill;white-space:nowrap;transform-origin:50% 50%}
.big small{display:block;font-size:62px;color:#fff;-webkit-text-stroke:13px #000;margin-top:16px}
#sub{position:absolute;left:60px;right:60px;top:1330px;text-align:center;color:#fff;font-size:66px;line-height:1.12;-webkit-text-stroke:12px #000;paint-order:stroke fill}
#sub b{color:#ffd23a}
#nick{position:absolute;left:50%;top:1560px;transform:translateX(-50%);background:#5dff8a;color:#0d2a14;border:8px solid #fff;border-radius:40px;padding:14px 44px;font-size:84px;white-space:nowrap;box-shadow:0 0 60px 16px rgba(93,255,138,.5);display:none}
</style></head><body>
<div id="stage">
 <iframe id="map" src="../../karta/index.html?video"></iframe>
 <div id="shade"></div>
 <div class="big" id="big"></div>
 <div id="sub"></div>
 <div id="nick"></div>
</div>
<script>
// Шортс «Район башни» v3 (16,5 с, петля). Хук: «Вы построили 2000 этажей за сутки — и башня улетела в космос». Карта не меняется.
const W=1080,H=1920,DUR=16.5,TX=22,TZ=534,TW=83,CXD=52,TOPY=2132;
const $=id=>document.getElementById(id);
let cw,THREE,sc,cam,R,SKY=null,STARS=null,LABS=[],FOG0=null;
const cl=(x,a,b)=>Math.max(a,Math.min(b,x)),sm=(a,b,x)=>{const k=cl((x-a)/(b-a),0,1);return k*k*(3-2*k)},lerp=(a,b,k)=>a+(b-a)*k,L3=(a,b,k)=>a.map((v,i)=>lerp(v,b[i],k));
const BIG=[[0,3.2,'2 000 ЭТАЖЕЙ','<small>за одни сутки</small>'],[3.2,5.2,'УЛЕТЕЛА<br>В КОСМОС 🚀',''],[5.2,7.5,'РАЙОН БАШНИ','<small>новый район Марса</small>'],[7.5,10.5,'458 ДОМОВ','<small>дом каждому, кто написал</small>'],[10.5,12.5,'БАШНЯ-БЛИЗНЕЦ?',''],[12.5,14.5,'ПИШИ НИК 👇',''],[14.5,16.5,'КАРТА ГОРОДА','<small>ссылка в описании канала 👆</small>']];
const LINES=[[0,3.2,'Вы построили <b>две тысячи этажей</b> за сутки…'],[3.2,5.2,'…и башня <b>улетела в космос</b>!'],[5.2,7.5,'А внизу вырос <b>новый район</b>.'],[7.5,10.5,'Каждый, кто написал коммент, получил <b>здесь дом</b>.'],[10.5,12.5,'А это место… для <b>второй башни</b>.'],[12.5,14.5,'Пиши ник — следующий дом <b>твой</b>.'],[14.5,16.5,'Найди себя на карте — ссылка <b>в описании канала</b>.']];
// камера: высота подъёма вдоль фасада с никами (ники — этажи 1…491), потом разгон к верху
function climbY(t){if(t<3.2)return lerp(2,470,Math.pow(t/3.2,1.15));const k=sm(3.2,4.6,t);return lerp(470,TOPY+40,k)}
function camAt(t){
 if(t<5.2){const y=climbY(t),d=t<3.2?48:lerp(48,80,sm(3.6,5.2,t));return [[TX+d*.25,y+(t<3.2?-6:lerp(1,30,sm(4.2,5.2,t))),TZ+d],[TX,y+(t<3.2?2:lerp(2,-25,sm(4.2,5.2,t))),TZ]]}
 const SH=[[5.2,7.5,[TX+60,TOPY*0.4,TZ+120],[CXD,0,TZ-40],[CXD+20,170,TZ+120],[CXD,0,TZ-70]],[7.5,10.5,[CXD+20,170,TZ+120],[CXD,0,TZ-70],[CXD-10,60,TZ+10],[CXD,0,TZ-85]],
  [10.5,12.5,[TW+60,60,TZ+70],[TW,20,TZ],[TW+28,26,TZ+34],[TW,12,TZ]],[12.5,14.5,[TW+28,26,TZ+34],[TW,12,TZ],[CXD+10,300,TZ+260],[CXD,0,TZ]],[14.5,16.5,[CXD+10,300,TZ+260],[CXD,0,TZ],[TX+12,3,TZ+48],[TX,4,TZ]]];
 const s=SH.find(x=>t>=x[0]&&t<x[1])||SH[SH.length-1],k=sm(s[0],s[1],t);if(s[0]===5.2){const u=cl((t-5.2)/2.3,0,1),kp=u*u*(3-2*u),kt=sm(5.2,6.3,t);const P0=[TX+20,TOPY+70,TZ+80],T0=[TX,TOPY+15,TZ],pos=L3(P0,s[4],kp),nz=v=>{const l=Math.hypot(...v);return v.map(x=>x/l)},d0=nz(T0.map((x,i)=>x-P0[i])),d1=nz(s[5].map((x,i)=>x-s[4][i])),d=nz(L3(d0,d1,kt));return [pos,pos.map((x,i)=>x+d[i]*100)]}return [L3(s[2],s[4],k),L3(s[3],s[5],k)]}
function build(){const lab=cw.eval('lab'),mk=cw.eval('mk');
 sc.traverse(o=>{if(o.isMesh&&o.geometry&&o.geometry.parameters&&o.geometry.parameters.radius===1500)SKY=o});
 {const n=2500,p=new Float32Array(n*3);let s=7;const r=()=>{s=s*16807%2147483647;return s/2147483647};for(let i=0;i<n;i++){const a=r()*6.283,b=Math.acos(r()*.95),R0=1300;p[i*3]=Math.cos(a)*Math.sin(b)*R0;p[i*3+1]=Math.cos(b)*R0;p[i*3+2]=Math.sin(a)*Math.sin(b)*R0}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));STARS=new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:2.2,sizeAttenuation:false,transparent:true,opacity:0,fog:false,depthWrite:false}));sc.add(STARS)}
 const D=cw.RBD,P=cw.RB_PLOTS;for(let k=0;k<40;k++){const p=P[k],g=new THREE.Group();lab(g,'@'+D.houses[k],10,2,'#1d2a44','#ffd23a',0,10.5,0);g.position.set(p[0],0,p[1]);g.visible=false;sc.add(g);LABS.push({g,t:7.6+k*.05})}
 {const p=P[600],g=new THREE.Group(),h=mk('kupol');g.add(h);lab(g,'@кот_мэр 🐱',10,2,'#f2a23a','#1a1410',0,10.5,0);g.position.set(p[0],0,p[1]);g.visible=false;sc.add(g);LABS.push({g,t:9.2,cat:1})}
 FOG0=[sc.fog.near,sc.fog.far,sc.fog.color.getHex()];cam.far=8000}
function seek(t){t=((t%DUR)+DUR)%DUR;const [p,q]=camAt(t);cam.position.set(...p);cam.lookAt(...q);cam.fov=55;cam.updateProjectionMatrix();
 // космос: чем выше камера, тем темнее небо и ярче звёзды
 const sp=cl((cam.position.y-500)/1300,0,1);if(SKY){SKY.material.color.setRGB(1-sp*.96,1-sp*.96,1-sp*.9)}if(STARS){STARS.material.opacity=sp;STARS.position.copy(cam.position)}
 sc.fog.near=lerp(400,3000,sp);sc.fog.far=lerp(1100,9000,sp);sc.fog.color.setHex(FOG0[2]).lerp(new THREE.Color(0x05060f),sp);
 LABS.forEach(h=>{const a=cl((t-h.t)/.18,0,1),on=t>=h.t&&t<(h.cat?9.6:16.3);h.g.visible=on;if(on){const b=a<1?1+.3*Math.sin(a*Math.PI):1;h.g.scale.set(b,a<1?a:1,b)}});
 R.render(sc,cam);
 const B=BIG.find(x=>t>=x[0]&&t<x[1]);$('big').innerHTML=B?B[2]+B[3]:'';const pk=B?cl((t-B[0])/.15,0,1):1;$('big').style.transform=`scale(${1.12-.12*pk})`;
 const Ln=LINES.find(x=>t>=x[0]&&t<x[1]);$('sub').innerHTML=Ln?Ln[2]:'';
 const ty=cl((t-12.7)/1.2,0,1),full='@ТВОЙ_НИК';$('nick').style.display=t>=12.7&&t<14.5?'block':'none';$('nick').textContent=full.slice(0,Math.max(1,Math.round(ty*full.length)))}
function fit(){if(document.body.classList.contains('render'))return;const k=Math.min(innerWidth/W,innerHeight/H);$('stage').style.transform=`scale(${k})`;$('stage').style.left=(innerWidth-W*k)/2+'px'}
addEventListener('resize',fit);fit();if(/[?&]render/.test(location.search)){document.body.classList.add('render');$('stage').style.transform='none'}
$('map').addEventListener('load',()=>{cw=$('map').contentWindow;const iv=setInterval(()=>{if(!cw.MP)return;clearInterval(iv);
 try{THREE=cw.THREE;sc=cw.eval('sc');cam=cw.eval('cam');R=cw.eval('R');cw.requestAnimationFrame=()=>0;
  const st=cw.document.createElement('style');st.textContent='.o:not(canvas),.bub,.pn,.mp,#mpTop,#mpCtl,#mpBot,#mpEye,#sys,button{display:none!important}';cw.document.head.appendChild(st);
  cw.MP.draw();sc.traverse(o=>{if(o.isSprite)o.visible=false});build();seek(0);window.READY=true}catch(e){console.error(e);window.SCENE_ERR=e.message+' '+(e.stack||'')}},200)});
let play=null;addEventListener('keydown',e=>{if(e.key!==' '||!window.READY)return;if(play){cancelAnimationFrame(play);play=null;return}const t0=performance.now();const lp=()=>{seek((performance.now()-t0)/1000);play=requestAnimationFrame(lp)};lp()});
window.seek=seek;window.DUR=DUR;window.LINES=LINES;window.vkey=t=>'k'+Math.round(t*30);
</script></body></html>

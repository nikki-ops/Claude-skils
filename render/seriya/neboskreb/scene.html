  [2.45,[x+34,296,z+52,x,300,z]],[4.2,[x+30,292,z+48,x,302,z]],
  [4.5,[F.x+10,36,F.z+66,F.x,2,F.z-2]],[5.5,[F.x+6,34,F.z+62,F.x,2,F.z-2]],

  [13.3,[F.x+12,40,F.z+74,F.x,2,F.z-4]],[15.9,[F.x+8,38,F.z+70,F.x,2,F.z-4]],

 else if(t<T.timer){yaw=yawCam-1.0;A1.rotation.x=-1.45;A1.rotation.z=.15;C.hd.rotation.y=.5}// профиль: смотрит, как прилетает дом

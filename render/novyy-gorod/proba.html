<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Проба мира нового города</title>
<style>html,body{margin:0;background:#000}#gl{width:1080px;height:1920px;display:block}</style></head><body>
<canvas id="gl"></canvas>
<script src="raskladka.js"></script>
<script type="importmap">{"imports":{"three":"/render/_istochniki/three/build/three.module.js"}}</script>
<script type="module">
// Проба: ?v=doma — 6 домов крупно; ?v=karta — общий вид карты с рекой, мостом, озером и вулканом.
import * as THREE from 'three';import {makeHouse,makeWorld,height} from './mir.js';
try{const W=1080,H=1920,R=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:true,preserveDrawingBuffer:true});R.setPixelRatio(1);R.setSize(W,H,false);R.outputColorSpace=THREE.SRGBColorSpace;R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const sc=new THREE.Scene();sc.fog=new THREE.Fog(0xd6ecff,160,560);const cam=new THREE.PerspectiveCamera(45,W/H,.1,900);
sc.add(new THREE.Mesh(new THREE.SphereGeometry(600,24,12),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,vertexShader:'varying vec3 p;void main(){p=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'varying vec3 p;void main(){float h=clamp(p.y*1.4,0.,1.);gl_FragColor=vec4(mix(vec3(.82,.93,1.),vec3(.2,.52,.95),pow(h,.55)),1.);}'})));
sc.add(new THREE.HemisphereLight(0xeaf6ff,0x7ab040,1.3));const sun=new THREE.DirectionalLight(0xfff3dc,2.1);sun.position.set(-40,60,40);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-60,right:60,top:60,bottom:-60,far:220});sun.shadow.bias=-.0004;sc.add(sun);
const world=makeWorld(THREE,sc);world.tick(3);
const nicks=['lazy_bone1','Глбушек','тюлень','MIMIK','Kospy-17','Yokubini','doll-Islam','Amirhan','Влад','UnO','ABIBA','Kristmas','two-time','Tulengibus','Ilona','Grishay','Jevin','Insaf','Smachniu','Artur'];
nicks.forEach((n,i)=>{const u=uchastok(i+1),h=makeHouse(THREE,{nick:n});h.position.set(u.x,height(u.x,u.z),u.z);h.rotation.y=0;sc.add(h)});
// площадь с табличкой
const pl=new THREE.Mesh(new THREE.CylinderGeometry(5,5,.1,32),new THREE.MeshLambertMaterial({color:0xe8d8b0}));pl.position.y=.05;pl.receiveShadow=true;sc.add(pl);
const v=new URLSearchParams(location.search).get('v')||'doma';
if(v==='doma'){cam.position.set(-6,9,32);cam.lookAt(0,1.5,0)}else{cam.position.set(-60,70,110);cam.lookAt(25,0,-40)}
cam.updateProjectionMatrix();R.render(sc,cam);window.READY=true}catch(e){window.SCENE_ERR=e.stack||String(e)}
</script></body></html>

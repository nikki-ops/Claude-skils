<style>

html,body{height:100%}body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.card{pointer-events:auto;background:var(--panel);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:10px 14px}
h1{margin:0;font-size:20px;font-weight:900;letter-spacing:.01em}h1 b{color:var(--accent)}
#cnt{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
#q{font:600 15px var(--font);border:2px solid var(--gold);border-radius:12px;padding:8px 12px;width:min(260px,70vw);background:var(--panel);color:var(--ink)}
#q:focus{outline:3px solid var(--accent)}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);font-size:13px;color:var(--muted);background:var(--panel);padding:6px 12px;border-radius:10px;opacity:.9}
#sug{position:absolute;top:100%;left:0;right:0;margin-top:6px;padding:4px 0;max-height:240px;overflow:auto}
#sug div{padding:8px 12px;cursor:pointer;font-weight:600}#sug div:hover{background:var(--bg)}
.qw{position:relative;pointer-events:auto}
#bar{height:8px;border-radius:6px;background:var(--bg);margin-top:6px;overflow:hidden}#bar i{display:block;height:100%;background:var(--gold)}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);background:var(--panel);color:var(--ink);border:2px solid var(--gold);border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.me{background:var(--gold);color:#1d2433;font-size:14px;border-color:#fff}
#ctl{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 60px);display:flex;flex-direction:column;gap:8px}
#ctl button,#card button,#card a{font:600 14px var(--font);border:0;border-radius:12px;padding:10px 12px;background:var(--panel);color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer;text-decoration:none;text-align:center}
#ctl button:focus-visible,#card button:focus-visible{outline:3px solid var(--accent)}
#card{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:420px;margin:0 auto}
#card .no{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}#card .nm{font-size:24px;font-weight:900;margin:2px 0;word-break:break-word}
#card .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}#card .row>*{flex:1}
#card a.tg{background:#2aa3e0;color:#fff}
#err{position:fixed;inset:auto 16px 60px 16px;color:#b00;background:#fff;padding:8px;border-radius:8px}
</style>

// Кварталы 2×2 участка идут по квадратной спирали вокруг центральной площади (квартал 0 = площадь).
(function(){
const PLOT=6, ROAD=4, BLOCK=PLOT*2+ROAD; // метры
function spiral(k){ // k-й квартал по квадратной спирали: 0→(0,0),1→(1,0),2→(1,1)...
 if(k===0)return [0,0];let x=0,y=0,dx=1,dy=0,len=1,steps=0,turns=0;
 for(let i=0;i<k;i++){x+=dx;y+=dy;if(++steps===len){steps=0;[dx,dy]=[-dy,dx];if(++turns%2===0)len++}}return [x,y]}
const RAYONY=[[0,'Центр'],[51,'Северный'],[151,'Восточный'],[301,'Южный'],[501,'Западный']];
window.uchastok=function(n){ // n — номер жителя с 1

 return {x,z,blok:blk,slot,rayon}};
window.GOROD={PLOT,ROAD,BLOCK,spiral};
})();
</script>
